tier = "fast"
guard = """
The last swallow in the callback, and the only place in this file where a
programming error can hide forever -- so it is also the one most in need of
a row saying it is load-bearing rather than decorative.

Reporting is the riskiest thing the guard does: it allocates an f-string
and formats a traceback, which is exactly what a MemoryError breaks next,
and the write can fail on a closed stderr. Without this catch, a report
that fails takes the dispatch thread with it -- the guard would then have
converted "one lost edge" into "every button on the device, permanently",
which is worse than not guarding at all.

The mutation narrows the catch to a type that cannot occur there. The named
test makes `_report` raise MemoryError and requires the callback to return
anyway."""

tier = "fast"
guard = """
`chpasswd -e` writes its second field into /etc/shadow verbatim, so an EMPTY
second field is an account that logs in with NO PASSWORD -- on an appliance
that boots to a console with a keyboard and a screen attached. A card pulled
mid-write is enough to produce one, and so is anyone with a card reader. `!`
and `*` are the mirror: a store that can LOCK the only account takes away the
recovery path this change exists to provide.

TWO EDITS, because the property is defended twice and neither clause catches
the empty string on its own: the crypt-shape case rejects it for having no
`$`, and the length bound rejects it for being shorter than twenty
characters. Stating the redundancy beats dropping the row."""

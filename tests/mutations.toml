[[mutation]]
name = "panel-keeps-a-press-time-a-failed-press-start-left-behind"
tier = "fast"
guard = """
What the report for a lost press start promises: "the release after it is
ignored". If a failed `_on_press` leaves the previous press's timestamp in
place, the next release measures against it, finds more than HOLD_SECONDS,
and emits BACK where the operator pressed OK. While a job is printing those
mean opposite things -- BACK can purge the spool and destroy a pad pair --
which is the confusion the whole tap-versus-hold design exists to prevent.

Defensive rather than reachable: gpiozero alternates pressed/released and
`_on_release` clears before it can fail, so nothing constructs the stale
state from outside today. The row exists because one line is what makes the
report's promise true without depending on that staying so.


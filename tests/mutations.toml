replace = '''if true; then'''


[[mutation]]
name = "tier3-backstop-message-contradicts-the-console"
tier = "fast"
guard = """
rc=124 with an empty early-stop is not the same as a guest that said
nothing: the sampler looks every 30 seconds, so a done line printed inside
the last window reaches the console and never reaches early-stop. The old
wording announced "ran to the backstop without a guest report" over a
console holding a complete report -- a diagnosis contradicted by the file
next to it, which is how a healthy-but-slow boot gets read as a dead one."""
tests = [
  "tests/test_img_verdict.py::test_a_backstopped_boot_that_did_report_is_not_called_silent",

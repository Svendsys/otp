guard = """
The guard's own report, on the guard's own thread. Catching the exception
bought a panel that survives a lost edge and then handed lgpio's single
dispatch thread a write to stderr -- which on the unit is a stream socket
to journald. A socket nobody is draining does not raise, it BLOCKS, and a
thread parked in write(2) delivers no further edges: the same dead panel
the guard exists to prevent, and harder to see, because the thread is still
alive and every is_alive() assertion in this file still passes for it.
`except BaseException: pass` cannot help with a call that never returns.

Measured before the check existed: a pipe shrunk to 4 KiB with F_SETPIPE_SZ
and no reader, sys.stderr pointed at it, one `_report` on a thread -- the
thread never came back. And the moment it would happen is the moment the
panel is losing edges, because that is when this writes.

The mutation removes the question and writes regardless. The named test
wedges a real pipe and requires a later press to arrive anyway; it goes red
by timing out on that press, not by hanging.

[stand-in] only, for the reason the row above gives: [lgpio] skips wherever
lgpio is not installed, which is every CI run of the fast tier."""
tests = [

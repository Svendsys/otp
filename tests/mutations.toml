[[mutation]]
name = "imgcheck-unit-start-timeout-too-short"
tier = "fast"
guard = """
The probe's own bounded waits sum to 270 seconds -- 90 polling for
otp-unit.service, 120 for systemd's verdict on the wizard, 60 bounding the
malformed-seed experiment -- with cupsd -t and two Python interpreters under
TCG in between. A timeout that does not clear that kills the probe mid-poll
on a slow but healthy boot, and the phase then has no OTP-GUEST-DONE line,
which the harness fails it for. Red rather than green, so a flake risk
rather than a false pass, but the number has to be stated rather than
inherited."""
tests = [
  "tests/test_overlay_root.py::test_the_probe_is_given_longer_than_its_own_bounded_wait",
]
[[mutation.edit]]
file = "device/systemd/otp-unit-imgcheck.service"
find = "TimeoutStartSec=420"
replace = "TimeoutStartSec=60"


[[mutation]]
name = "guest-probe-runs-without-a-phase-token"
tier = "fast"
guard = """
The probe refuses to run unless the kernel command line names boot1 or
boot2, and that guard protects a REAL UNIT rather than a test. The script
ships 0755 in /opt/otp-unit and its service is enabled on every appliance;
what it does is write a sentinel to / and pages=137 through config.save()
into /boot/firmware/otp-unit.conf, which is outside the overlay and so
permanent. Before the guard, an absent token meant PHASE=unknown and every
check ran regardless -- measured against a realistic device command line,
the operator's page count went 500 -> 137. The unit's
ConditionKernelCommandLine= is the other lock; this row is the one that
holds when a drop-in, a hand-run `systemctl start` or anything resolving
the ExecStart path steps past it."""
tests = [
  "tests/test_overlay_root.py::test_the_probe_is_inert_on_a_command_line_without_the_token",
  "tests/test_overlay_root.py::test_a_phase_that_is_not_one_of_the_two_is_refused",
  "tests/test_overlay_root.py::test_the_command_line_is_split_but_not_glob_expanded",
]
[[mutation.edit]]
file = "harness/img-guest-check.sh"
find = '''case "$PHASE" in
    boot1|boot2) ;;'''
replace = '''case "$PHASE" in
    *) ;;'''


[[mutation]]
name = "guest-probe-cmdline-glob-expanded"
tier = "fast"
guard = """
The token loop word-splits an unquoted command substitution, which is
wanted, and `set -f` is what stops it being PATHNAME EXPANDED as well. The
unit runs as root with a working directory of /, so with globbing on a bare
`*` in the command line becomes the listing of the root directory before
the case sees it. Measured with the guard removed and a directory holding a
file named `otp.imgcheck=boot2`: the probe selected phase boot2 from that
filename and ran."""
tests = [
  "tests/test_overlay_root.py::test_the_command_line_is_split_but_not_glob_expanded",
]
[[mutation.edit]]
file = "harness/img-guest-check.sh"
find = '''PHASE=""
set -f
'''
replace = '''PHASE=""
'''


# --- what provisioning is allowed to leave behind -------------------------

[[mutation]]
name = "install-overlay-initramfs-not-verified"
tier = "fast"
guard = """
The initramfs has to CONTAIN scripts/overlay, not merely exist. One built
before the overlay script was written has the right name and the right size,
the firmware loads it, and boot=overlay is then read by nothing -- so the
unit comes up on a writable root and nothing anywhere says so. install.sh
reads the archive rather than stat()ing the file for exactly that case."""
tests = [
  "tests/test_overlay_root.py::test_an_initramfs_without_the_overlay_script_fails_the_install",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''        case "$LISTING" in
            *scripts/overlay*)'''
replace = '''        case "anything" in
            *)'''


[[mutation]]
name = "install-overlay-listing-piped-into-grep-q"
tier = "fast"
guard = """
The check reads the listing into a variable instead of piping it, and that
is not a style choice. install.sh runs under pipefail; `grep -q` closes the
pipe on its first match, lsinitramfs dies of SIGPIPE, and the pipeline
returns 141 -- so the condition is false for exactly the initramfs that
passes and the build fails on a good image. Measured with a 300k-line
producer: `NO MATCH (rc of pipeline was nonzero)`, rc=141.

This is the form the check was FIRST WRITTEN IN, and a three-line fixture
never catches it: the producer finishes before grep can exit. The listing
in tests/test_overlay_root.py is 20k lines with scripts/overlay near the
top for that reason, and this row is what keeps it that size."""
tests = [
  "tests/test_overlay_root.py::test_a_good_initramfs_passes_the_verification",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''        LISTING=$(lsinitramfs "$candidate" 2>/dev/null || true)
        case "$LISTING" in
            *scripts/overlay*)
                OVERLAY_INITRAMFS="$candidate"
                break
                ;;
        esac'''
replace = '''        if lsinitramfs "$candidate" 2>/dev/null | grep -q "scripts/overlay"; then
            OVERLAY_INITRAMFS="$candidate"
            break
        fi'''


[[mutation]]
name = "overlay-lower-layer-mounted-writable"
tier = "fast"
guard = """
`-r` on the lower mount is the line that makes the card read-only for the
whole life of the boot: without it the running system has a writable handle
on the filesystem it booted from, and the appliance is a slower way of
writing to an SD card rather than a machine a power-cycle resets. It is the
most safety-critical line in the overlay script and it had no row."""
tests = [
  "tests/test_overlay_root.py::test_the_lower_layer_is_mounted_read_only",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''	if ! mount -r ${FSTYPE:+-t "${FSTYPE}"} ${ROOTFLAGS} "${ROOT}" /lower; then'''
replace = '''	if ! mount ${FSTYPE:+-t "${FSTYPE}"} ${ROOTFLAGS} "${ROOT}" /lower; then'''


[[mutation]]
name = "initramfs-updated-instead-of-created"
tier = "fast"
guard = """
`-c`, not `-u`, and the comment above the line has always named this exact
defect: pi-gen sets update_initramfs=no in update-initramfs.conf, and
update-initramfs honours that setting on its UPDATE path only. `-u` prints
"Not updating initramfs." and exits 0, leaving the overlay script out of an
initramfs that already exists, has the right name and is the right size --
the firmware loads it, boot=overlay is read by nothing, and the unit comes
up on a writable root. The edit survived the whole fast suite until the
build loop was run against a recording stub."""
tests = [
  "tests/test_overlay_root.py::test_the_initramfs_is_created_and_not_merely_updated",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''        update-initramfs -c -k "$kern"'''
replace = '''        update-initramfs -u -k "$kern"'''


[[mutation]]
name = "empty-kernel-list-not-refused"
tier = "fast"
guard = """
The kernel list is read out of /lib/modules because in pi-gen's chroot
`uname -r` is the build host's kernel -- which is what stops raspi-config's
enable_overlayfs working at image-build time at all. An empty list means no
initramfs can be built and the overlay cannot be enabled, so provisioning
stops there rather than building nothing and leaving the later verification
as the only thing between that and a released image."""
tests = [
  "tests/test_overlay_root.py::test_no_kernel_under_lib_modules_stops_provisioning",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''        echo "       can be built and the overlay cannot be enabled." >&2
        exit 1'''
replace = '''        echo "       can be built and the overlay cannot be enabled." >&2
        :'''


[[mutation]]
name = "image-build-ships-an-unprobeable-image"
tier = "fast"
guard = """
Every other overlay precondition in install.sh exits 1 under --image-build.
The probe install printed a NOTE, so a build could produce, upload and
release an image whose read-only root nothing can observe -- and the miss
does not surface until a pi-gen build and two emulated boots later, as a
guest that never reported, which reads as a boot failure rather than the
packaging error it is."""
tests = [
  "tests/test_overlay_root.py::test_an_image_build_without_the_probe_fails",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''elif [ "$IMAGE_BUILD" -eq 1 ]; then'''
replace = '''elif [ "$IMAGE_BUILD" -eq 9 ]; then'''


[[mutation]]
name = "image-build-probe-not-installed"
tier = "fast"
guard = """
The other end of the same thing: the file can be present and simply not
copied. Deleting this one line survived the entire fast suite, and what it
costs is the whole of tier 3's view inside the guest."""
tests = [
  "tests/test_overlay_root.py::test_the_probe_is_installed_when_it_is_there",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''    install -m 0755 "$REPO_DIR/harness/img-guest-check.sh" \
        "$PREFIX/img-guest-check.sh"'''
replace = '''    :'''


[[mutation]]
name = "image-stage-skips-a-missing-item"
tier = "fast"
guard = """
The pi-gen stage copies what install.sh reads, and it copied
`if [ -e ]` -- so a name dropped from the list, or a directory missing from
the checkout, was a silent no-op. Most of them then fail inside the chroot
on a path error; `harness` did not fail at all, and produced an image whose
overlay nothing could probe."""
tests = [
  "tests/test_overlay_root.py::test_a_missing_item_stops_the_stage_instead_of_being_skipped",
]
[[mutation.edit]]
file = "image/stage-otpunit/01-otpunit/00-run.sh"
find = '''	if [ ! -e "${REPO_SRC}/${item}" ]; then
		echo "ERROR: ${REPO_SRC}/${item} is missing, and install.sh reads" >&2
		echo "       it inside the chroot. Refusing to build an image" >&2
		echo "       without it." >&2
		exit 1
	fi
	cp -a "${REPO_SRC}/${item}" "${ROOTFS_DIR}${STAGING}/"'''
replace = '''	if [ -e "${REPO_SRC}/${item}" ]; then
		cp -a "${REPO_SRC}/${item}" "${ROOTFS_DIR}${STAGING}/"
	fi'''


[[mutation]]
name = "install-overlay-token-not-added"
tier = "fast"
guard = """
boot=overlay on the kernel command line is what makes the initrd source
/scripts/overlay at all. Without it the initramfs is built, loaded, and takes
the default local mount path -- a read-write root, with every other trace of
the overlay in place."""
tests = [
  "tests/test_overlay_root.py::test_the_overlay_token_is_added_to_the_command_line",

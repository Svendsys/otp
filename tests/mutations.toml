[[mutation]]
name = "tier3-kernel-entry-count-sees-the-journals-copy"
tier = "fast"
guard = """
The count that says "reboot loop", kept immune to the forwarding. journald
imports /dev/kmsg from the start of the buffer and labels those entries
`kernel`; if it forwards them to the console as well, every early kernel
line arrives twice and a healthy boot is failed as a loop.

MEASURED IN RUN 72, the first console this repository captured with
forwarding actually on: zero `kernel: ` lines, "Booting Linux on physical
CPU" once, both boots reporting one kernel entry. journald does not
re-forward what it imported, so the doubling this guard was written against
does not happen today. It stays because the exclusion costs one grep and
the behaviour belongs to a systemd setting rather than to us -- a
regression guard now, where it used to be a guess. tier3-reboot-loop-accepted
is the control that a real second entry, which carries no identifier in
front of it, still fails."""
tests = [
  "tests/test_img_verdict.py::test_a_journald_copy_of_a_kernel_line_is_not_a_second_boot",
]

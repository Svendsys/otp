name = "panel-loses-a-press-without-saying-so"
tier = "fast"
guard = """
The other half of the decision: catching is only half of it. The operator
cannot be told -- the panel is the thing that just failed, and this device
has no other output -- so the journal is the only record that an edge was
ever lost, and a guard that swallows in silence turns a diagnosable fault
into a unit that "sometimes misses presses".

The named test is the one that watches the DEFAULT reporter rather than a
monkeypatched one. Every other test in that class replaces `_report` to
read what it said, so all of them stay green against a `_report` that
writes nowhere at all -- which is exactly this mutation."""
tests = [
  "tests/test_hardware.py::TestALostPressIsSaidOutLoud::test_the_default_report_goes_to_stderr",
]

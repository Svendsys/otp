tier = "fast"
guard = """
The whole point, deleted. The store still fills up, every check that reads it
still passes, and the account still reverts to the build-time password on
every power cycle -- which is the defect, with a persistence mechanism
installed and reporting success on top of it."""
tests = [
  "tests/test_overlay_root.py::test_a_seeded_password_is_kept_and_comes_back_after_the_power_cycle",
  "tests/test_overlay_root.py::test_a_fresh_seed_this_boot_beats_the_credential_that_was_restored",
]

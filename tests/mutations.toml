name = "tier3-two-boot-claim-unconditional"
tier = "fast"
guard = """
The other half of the same defect, and the half that survives a phase list
nobody thought of: the concluding line said "the image boots twice on a
read-only overlay" whatever ran. It is the sentence a reader takes away and
the sentence image.yml's release note restates, so it states only what the
phases that ran support."""
tests = [
  "tests/test_img_verdict.py::test_the_two_boot_claim_is_only_made_by_a_run_that_booted_twice",
]

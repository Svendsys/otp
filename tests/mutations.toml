# --- the operator's login, which used to last one boot --------------------
#
# The seed reached /etc/shadow and /etc is inside the overlay, so the
# password worked for exactly one boot -- and userconf-service deletes the
# only file that could reapply it as the last step of applying it. The
# owner's decision out of {refuse the seed loudly, persist it, keep the seed
# file} is "persist it", and everything below is a way for that to be
# installed, enabled, green, and not true.
#
# THE EXPOSURE ROW IS THE FIRST ONE, deliberately. A password hash on the FAT
# partition is offline-crackable by every uid on this machine and by anyone
# with a card reader, and the one thing that keeps that bounded is that the
# store is only ever written from the wizard's own ExecStartPost -- so the
# only hash that reaches the card is one the operator's userconf.txt had
# already put there. A mutation that records on every boot puts pi-gen's
# build-time hash on the card of every unit ever made.

[[mutation]]
name = "identity-credential-recorded-on-every-boot"
tier = "fast"
guard = """
The bound on the exposure this whole change adds. The default phase runs at
sysinit on every boot of every unit; the recording phase runs only as an
ExecStartPost on the wizard. Merge them and a machine whose operator never
seeded anything gets a copy of pi-gen's random FIRST_USER_PASS hash written
to a partition every local account can read -- a hash nobody has, for a
password nobody wanted kept, on a device that prints one-time pads."""
tests = [
  "tests/test_overlay_root.py::test_an_unseeded_boot_puts_no_password_hash_on_the_boot_partition",
]
[[mutation.edit]]
file = "device/persist-identity.sh"
find = "credential_restore || rc=1"
replace = """credential_restore || rc=1
credential_record || rc=1"""



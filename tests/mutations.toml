pi-gen's `uninitialized` -- so systemd calls every boot a first boot, runs
preset-all every boot, and regenerates the host keys of a key printer every
time the power is pulled. Nothing else in the boot can put the file there:
PID 1 reads it before any unit exists."""
tests = [
  "tests/test_overlay_root.py::test_the_overlay_restores_the_machine_id_after_it_is_assembled",
]
[[mutation.edit]]
file = "device/install.sh"
find = "\n\totp_restore_machine_id\n}"
replace = "\n\t# the machine-id stays whatever the card says\n}"


[[mutation]]
name = "overlay-machine-id-not-validated"
tier = "fast"
guard = """
systemd rejects a malformed machine-id and calls the boot a first boot --
the state this exists to leave, reached by a longer route and with the
image's own file overwritten on the way. Anything that is not 32 lower-case
hex characters has to be dropped here."""
tests = [
  "tests/test_overlay_root.py::test_a_machine_id_that_is_not_32_hex_characters_is_not_written",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''		case "${id}" in
		*[!0-9a-f]*|"") continue ;;
		esac'''
replace = '''		case "${id}" in
		"") continue ;;
		esac'''


[[mutation]]
name = "overlay-identity-partition-mounted-writable"
tier = "fast"
guard = """
Reading a machine-id needs no write handle, and the whole mechanism this
rides in exists so that a boot never holds one it does not need. The same
`-r` argument the lower layer's mount carries, on the other partition."""
tests = [
  "tests/test_overlay_root.py::test_the_identity_partition_is_mounted_read_only",
]
[[mutation.edit]]
file = "device/install.sh"
find = '		mount -r -t vfat "${dev}" "${OTP_IDENTITY_MNT}" 2>/dev/null || continue'
replace = '		mount -t vfat "${dev}" "${OTP_IDENTITY_MNT}" 2>/dev/null || continue'


[[mutation]]
name = "identity-store-not-checked-for-being-outside-the-overlay"
tier = "fast"
guard = """
The same hole as guest-identity-store-may-be-inside-the-overlay, from the
writing end. $BOOT_DIR falls back to /boot when /boot/firmware is not a
directory, and /boot inside the overlay is a tmpfs: the script would copy
this boot's identity into RAM, read it back happily, and lose it -- every
boot, for the life of the unit, in silence."""
tests = [
  "tests/test_overlay_root.py::test_a_store_inside_the_overlay_is_refused_rather_than_written",
]
[[mutation.edit]]
file = "device/persist-identity.sh"
find = 'if [ -z "$STORE_SRC" ] || [ "$STORE_SRC" = "$ROOT_SRC" ]; then'
replace = 'if false; then'


[[mutation]]
name = "identity-store-overwritten-by-a-boot-that-lost-it"
tier = "fast"
guard = """
A stored machine-id that does not match the running one means the initramfs
restore did not happen. The stored value is the one that still has a chance
of being restored next time; replacing it with this boot's random id makes
the store chase a value that changes every boot and never converge, while
looking correct on every single one of them."""
tests = [
  "tests/test_overlay_root.py::test_a_kept_machine_id_is_not_overwritten_by_a_boot_that_lost_it",
]
[[mutation.edit]]
file = "device/persist-identity.sh"
find = 'elif [ ! -s "$STORE/machine-id" ]; then'
replace = 'elif true; then'


[[mutation]]
name = "tier3-identity-checks-not-required"
tier = "fast"
guard = """
The named-check gate over the identity, and the release note that quotes it.
Drop the name and both boots still pass everything else -- the overlay
discards, the settings survive, the panel is detected -- while the machine
comes up as a different machine every time and the note attached to a tag
says it did not."""
tests = [
  "tests/test_img_verdict.py::test_the_harness_and_the_guest_agree_on_which_checks_exist",
  "tests/test_image_workflow.py::test_the_release_notes_identity_claim_is_backed_by_the_harness",
]
[[mutation.edit]]
file = "harness/img-boot.sh"
find = '''network-wait-cannot-hold-the-boot-open \
machine-id-persisted-outside-the-overlay"'''
replace = '''network-wait-cannot-hold-the-boot-open"'''


[[mutation]]
name = "install-userconf-wizard-never-enabled"
tier = "fast"
guard = """
The unit that consumes the documented headless credential file has to be
pulled into the boot, and until run 32020772161 nothing in this repository
enabled it -- first-boot `preset-all` did, on every boot, because every boot
was a first boot. Persisting the machine-id ended that and boot2 reported
`is-enabled=disabled`. A disabled unit ignores an operator's userconf.txt in
silence on every boot after the first, which is the outcome the drop-in above
replaced a `mask` to avoid."""
tests = [
  "tests/test_overlay_root.py::test_the_wizard_is_enabled_in_the_image_and_not_by_accident",
]
[[mutation.edit]]
file = "device/install.sh"
find = "systemctl enable userconfig.service 2>/dev/null || true"
replace = "systemctl status userconfig.service >/dev/null 2>&1 || true"


# --- the userspace half of the identity, which had no fast tier at all ----
#
# Everything above drives persist-identity.sh and the guest probe directly.
# None of it touched the four lines in device/install.sh that put the script
# and its unit on the machine, or the unit's own content: deleting the
# install block left the suite green, and so did gutting the unit down to
# `ExecStart=/bin/true` with no [Install] section. An image that installs and
# enables nothing boots, prints, and loses its identity on every power cycle,
# and the only thing that would have said so is a sixteen-minute tier-3
# build.

[[mutation]]
name = "install-identity-unit-never-installed"
tier = "fast"
guard = """
The unit file has to reach /etc/systemd/system, or `systemctl enable` on the
next line resolves an [Install] section out of a file that is not there.
Deleting this line leaves a machine with the script in /opt/otp-unit and
nothing that ever runs it."""
tests = [
  "tests/test_overlay_root.py::test_the_identity_script_and_its_unit_are_both_installed",
]
[[mutation.edit]]
file = "device/install.sh"
find = '''    install -m 0644 "$REPO_DIR/device/systemd/otp-unit-identity.service" \
        /etc/systemd/system/otp-unit-identity.service'''
replace = '''    :'''


[[mutation]]
name = "install-identity-unit-never-enabled"
tier = "fast"
guard = """
A unit file with no symlink pointing at it is a unit systemd never runs.
Nothing else on this image enables it -- and the accident that used to,
first-boot `preset-all`, is exactly what this unit exists to end, so it
cannot be relied on to enable its own cure. The machine-id is then recorded
by nothing and every boot is a first boot again, in silence."""
tests = [
  "tests/test_overlay_root.py::test_the_identity_unit_is_enabled_and_not_merely_dropped_in_place",
]
[[mutation.edit]]
file = "device/install.sh"
find = "    systemctl enable otp-unit-identity.service"
replace = "    systemctl status otp-unit-identity.service >/dev/null 2>&1 || true"


[[mutation]]
name = "identity-unit-wanted-by-nothing"
tier = "fast"
guard = """
`systemctl enable` reads [Install] and makes the symlink it names. Without
the section the enable is accepted, prints nothing an operator would notice,
and creates no symlink at all -- the unit is installed, enabled by the
letter, and pulled into no boot."""
tests = [
  "tests/test_overlay_root.py::test_the_unit_still_runs_before_anything_that_reads_the_identity",
]
[[mutation.edit]]
file = "device/systemd/otp-unit-identity.service"
find = """[Install]
WantedBy=sysinit.target"""
replace = """# [Install] removed"""


[[mutation]]
name = "identity-unit-runs-nothing"
tier = "fast"
guard = """
A oneshot that succeeds without doing anything is the quietest possible
version of this failure: the unit is enabled, active and green in
`systemctl status`, and the store on the boot partition is never written."""
tests = [
  "tests/test_overlay_root.py::test_the_unit_still_runs_before_anything_that_reads_the_identity",
]
[[mutation.edit]]
file = "device/systemd/otp-unit-identity.service"
find = "ExecStart=/opt/otp-unit/persist-identity.sh"
replace = "ExecStart=/bin/true"


[[mutation]]
name = "identity-host-keys-copied-to-the-boot-partition"
tier = "fast"
guard = """
The owner's decision, held as a property of the shipped script rather than of
the comment that announces it. This appliance does not run sshd -- ENABLE_SSH
=0 leaves ssh.service disabled and only a genuine first boot's preset-all
ever started it -- so a host key on the FAT partition buys a fingerprint
nobody can be shown, at the price of a private key every local account can
read. A negative assertion needs to be able to fail; this is what makes it."""
tests = [
  "tests/test_overlay_root.py::test_no_private_key_is_written_to_the_boot_partition",
]
[[mutation.edit]]
file = "device/persist-identity.sh"
find = """sync 2>/dev/null || true"""
replace = """cp "$ETC_DIR"/ssh/ssh_host_*_key "$STORE/" 2>/dev/null || true
sync 2>/dev/null || true"""


# --- the two clauses systemd itself answers -------------------------------

[[mutation]]
name = "tier3-second-boot-may-be-a-first-boot"
tier = "fast"
guard = """
The one piece of evidence for the machine-id fix that owes nothing to a check
inside the guest: first-boot-complete.target is pulled in only when PID 1 read
/etc/machine-id and decided this was a first boot. Every guest check can be
green on a unit whose identity reverted -- the store agrees with the live id
because otp-unit-identity.service refilled it seconds earlier -- and this is
the line that says otherwise."""
tests = [
  "tests/test_img_verdict.py::test_a_second_boot_that_was_a_first_boot_all_over_again_fails",
]
[[mutation.edit]]
file = "harness/img-boot.sh"
find = """                printf 'IMG-CHECK %s second-boot-is-not-a-first-boot FAIL\\n' "$phase\""""
replace = """                printf 'IMG-CHECK %s second-boot-is-not-a-first-boot PASS\\n' "$phase\""""


[[mutation]]
name = "tier3-first-boot-target-not-required"
tier = "fast"
guard = """
The positive control boot2's absence rests on. An absence is equally
satisfied by a console nothing was written to, by a boot that died in the
initrd, and by a grep looking for a string systemd stopped printing. boot1 is
a first boot on every run -- the harness gives each one a fresh `xz -dc` of
the image -- so the same string, from the same grep over the same kind of
file, has to be found there."""
tests = [
  "tests/test_img_verdict.py::test_a_first_boot_that_never_completed_one_fails",
]
[[mutation.edit]]
file = "harness/img-boot.sh"
find = """                printf 'IMG-CHECK %s first-boot-really-was-a-first-boot FAIL\\n' "$phase\""""
replace = """                printf 'IMG-CHECK %s first-boot-really-was-a-first-boot PASS\\n' "$phase\""""


[[mutation]]
name = "install-growfs-mask-missing-from-the-summary"
tier = "fast"
guard = """
The summary is what an operator gets instead of a diff, and it said "Three
machine-wide changes" while the script made four -- the growfs mask landed in
the same round as the ssh.socket mask and never reached the paragraph anyone
reads. A permanent change with no undo instruction is the one that hurts six
months later. The test derives the list from every `systemctl mask` in the
file rather than restating it, which is why dropping a bullet is what fails
rather than a stale number."""
tests = [
  "tests/test_overlay_root.py::test_the_closing_summary_names_what_was_done_to_the_whole_machine",
]
[[mutation.edit]]
file = "device/install.sh"
find = """  * systemd-growfs-root.service is MASKED."""
replace = """  * systemd-growfs-root.service was left alone."""

The length half of the same promise. `select()` answering "writable" for a
pipe promises PIPE_BUF (4096) bytes and no more -- a longer write puts the
first 4096 in and parks in the kernel for the rest -- so asking the question
only proves anything if the message is capped below it. The report is built
from an exception's str() and a formatted traceback, neither of which this
code chooses the length of: a deep stack or a chatty OSError is enough.

A truncated line in the journal is a diagnostic. A parked dispatch thread is
a dead panel with three buttons that do nothing.

The mutation removes the cap. The named test writes 100 KB at a 4 KiB pipe
that has room and requires `_report` to come back."""

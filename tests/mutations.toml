[[mutation]]
name = "tier3-forbidden-phrase-red-does-not-say-which-unit"
tier = "fast"
guard = """
The red has to name the unit. Run 72 failed on `no-Failed-with-result` and
printed those four words and nothing else -- the same verdict for one
failing unit as for three -- so finding out WHICH unit meant downloading
the evidence artifact and grepping a thousand-line console by hand. Three
units were failing on every boot of the shipped image and the verdict named
none of them. The gate was right; only its report was useless, and a report
nobody can act on is most of the way to no gate at all."""
tests = [
  "tests/test_img_verdict.py::test_the_forbidden_phrase_says_which_lines_it_found",

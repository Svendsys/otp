value nobody has -- and the host, which can only watch the file disappear,
would call that success. pi-gen salts its hash randomly, so the marker salt
in the shadow entry can only have come from the seed."""
#
# ONE TEST, NOT TWO. `test_no_shadow_entry_at_all_fails` was listed here and
# does not go red for this edit -- measured on origin/master's own copy of

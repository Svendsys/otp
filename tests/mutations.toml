# --- tier 3: the journal on the console, and what it brought with it ------
#
# Issue #21. Until the journal was forwarded, tier 3 could see that the unit
# STARTED and nothing it did afterwards -- the journal is volatile by design
# and died with the guest. The rows here are the two halves of that: the
# forwarding itself, which is one token in one string and otherwise
# unobservable from the fast suite, and the console greps that were written
# for a console carrying only kernel output and PID 1.

[[mutation]]
name = "tier3-journal-forwarding-not-requested"
tier = "fast"
guard = """
The parameter itself. Everything else about the forwarding is checked
against evidence -- the verdict wants the marker on the console, the probe
wants the journal to have taken it -- but both of those only speak during a
CI boot. Delete the token and the fast suite stays entirely green for the
sixteen minutes it takes an arm64 runner to say otherwise."""
tests = [
  "tests/test_img_verdict.py::test_the_emulated_boot_asks_for_the_journal_on_its_console",
]
[[mutation.edit]]
file = "harness/img-boot.sh"
find = "systemd.show_status=1 systemd.journald.forward_to_console=1 initcall_blacklist"
replace = "systemd.show_status=1 initcall_blacklist"


[[mutation]]
name = "tier3-journal-forwarding-not-gated"
tier = "fast"
guard = """
A kernel parameter that is accepted and ignored looks exactly like one that
works: from outside, "the unit logged nothing worth reading" and "nothing
the unit logged could get out" are the same silence. The probe's marker
reaches the journal and nothing else, so this gate is the only thing that
can tell those apart -- and every behavioural reading this tier now makes
rests on the answer."""
tests = [
  "tests/test_img_verdict.py::test_a_console_the_journal_never_reached_fails",
  "tests/test_img_verdict.py::test_the_marker_has_to_name_the_phase_that_is_being_judged",
]
[[mutation.edit]]
file = "harness/img-boot.sh"
find = '''    if grep -qE "OTP-JOURNAL-FORWARDED[[:space:]]+${phase}([[:space:]]|\$)" \
            "$CONSOLE_TXT" 2>/dev/null; then'''
replace = '''    if true; then'''


[[mutation]]
name = "tier3-journal-marker-not-scoped-to-the-phase"
tier = "fast"
guard = """
Per phase, like every other marker this tier reads. Both boots write into
one evidence pipeline, so a phase-blind grep lets boot1's marker answer for
a boot2 whose journald forwarded nothing -- the trap the OTP-RESULT and
OTP-GUEST-DONE counts are phase-scoped to avoid."""
tests = [
  "tests/test_img_verdict.py::test_the_marker_has_to_name_the_phase_that_is_being_judged",
]
[[mutation.edit]]
file = "harness/img-boot.sh"
find = '"OTP-JOURNAL-FORWARDED[[:space:]]+${phase}([[:space:]]|\$)"'
replace = '"OTP-JOURNAL-FORWARDED"'


[[mutation]]
name = "tier3-forbidden-phrases-unscoped"
tier = "fast"
guard = """
Who said it. With the journal on the console these greps run over every
unit's stdout, including this harness's own probe -- which quotes
userconf-service's output into a check detail and dumps thirty lines of the
unit's journal at the end of every phase. Failing a release because a unit
REPEATED "Failed with result" is row 2 of issue #14 in a new place: the
harness matching text it wrote itself."""
tests = [
  "tests/test_img_verdict.py::test_a_unit_quoting_a_systemd_phrase_does_not_fail_the_release",
  "tests/test_img_verdict.py::test_no_forbidden_phrase_is_gated_when_only_a_unit_said_it",
]
[[mutation.edit]]
file = "harness/img-boot.sh"
find = '''        if grep -qF -- "$bad" "$SPOKEN" 2>/dev/null; then'''
replace = '''        if grep -qF -- "$bad" "$CONSOLE_TXT" 2>/dev/null; then'''


[[mutation]]
name = "tier3-forbidden-phrases-scoped-to-nothing"
tier = "fast"
guard = """
The other direction, and the one scoping breaks in. "A unit quoting the
phrase does not fail the run" is equally true of a filter that kept nothing
at all -- and then a kernel panic and systemd's own verdict on a failed unit
both go unseen, on a release gate reporting green."""
tests = [
  "tests/test_img_verdict.py::test_systemds_own_verdict_on_a_unit_still_fails_the_release",

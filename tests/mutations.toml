filtered copy, a boot where PID 1 failed one unit and this harness's own
probe quoted the phrase would print the probe's line under the red as
though systemd had said it -- and the reader would go hunting a unit that
never failed, from a verdict file that told them to. Wider is the safe
direction for a GATE; for a report it is how you lose an afternoon."""

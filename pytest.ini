[pytest]
# The hardware harness is deselected by default. It needs root, a cupsd and
# a kernel with gpio-sim / i2c-stub / vkms / uinput, and one full run takes
# about a minute against a real daemon -- none of which belongs in the loop
# a developer runs on every edit.
#
#   pytest                     the fast suite, no privileges, no daemons
#   pytest -m hardware         the harness (see harness/README.md)
#   pytest -m ''               everything
#
# It is deselected rather than left to skip itself so that `pytest` stays
# quick even when run as root on a machine that has CUPS installed.
addopts = -m "not hardware"
markers =
    hardware: drives the real code against kernel simulators and a real cupsd
    real_cups_runner: needs Cups._subprocess_run itself, not the conftest refusal

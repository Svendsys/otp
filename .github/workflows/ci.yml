name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per branch. Without this, pushing a fix leaves the superseded
# run going: two `vm` jobs booting three VMs each, for a commit nobody
# cares about any more. Measured -- two 40-minute jobs ran concurrently
# against the same branch, and the older one's result was worthless before
# it started.
#
# NOT cancelled on master: a push there is the record of what that commit
# does, and cancelling it to start the next one loses that permanently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Bounded: a UI regression can make the suite spin rather than fail
      # -- FakeButtons returns None forever at poll_seconds=0, so a screen
      # that stops honouring BACK loops instead of raising. Unbounded, that
      # is a runner burning for six hours and a job that never reports.
      - name: Run tests
        run: timeout 600 pytest -q

  mutation:
    # Break each load-bearing guard on purpose and require a test to go red.
    # Five checks in this repository have been found unable to fail, one per
    # audit round, and every one was found by hand -- see issue #14 and
    # tests/mutations.toml.
    #
    # PER PR, not nightly, and that is measured rather than assumed: the fast
    # tier is 164 mutations in 196 seconds ON THE DEVELOPMENT CONTAINER, not
    # on this runner -- the number is a development-time figure and always has
    # been, and a reader meeting it inside this job's own comment block will
    # otherwise take it for this job's runtime, which is a different and
    # usually smaller number (115s for the 145-row version of this line).
    # Counted, not carried forward -- this line said 19 in 11 seconds for a
    # long time after both had moved, 114 for one round after it was 115, and
    # 124 for several rounds after it was 143. Re-run
    # `python3 tests/mutation_gate.py --tier fast` and read its last line
    # before touching this sentence. The seconds are noisier than the count:
    # three runs of the same 159 rows on the same container measured 232s,
    # 190s and 192s, and two of the 164 rows measured 196s and 198s -- so
    # treat the figure as an order of magnitude and the row count as exact.
    #
    # It stopped being cheaper than the suite it audits at that count. Twelve
    # of the rows added for the local rig (issue #22) are behavioural rather
    # than textual: they run rig_boot against a fake emulator and TIME it,
    # because the property under test -- the guest's marker stops the run in
    # seconds instead of at the backstop -- is a clock, and the rows that
    # replaced were caught by "the source contains this string" and could not
    # fail. Four of them cost between four and twelve seconds each. That is
    # the price of the gate being able to fail, which is the only thing it is
    # for.
    #
    # The issue expected nightly or label-triggered; at this price
    # that would be the wrong call, because a gate that reports on the commit
    # which broke the guard is worth several that report the next morning. A
    # separate job rather than a step in `test`, so the ordinary suite's wall
    # clock does not move at all.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11+ for tomllib, which is why the table is TOML: it costs no
          # new dependency.
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Bounded like the suite above, and this one has a second way to hang:
      # a mutation can wedge a test rather than fail it. The runner caps each
      # mutated run itself; this is the backstop. `timeout` sends SIGTERM,
      # which the runner turns into an unwind so the tree is put back --
      # verified, because the first version of it did NOT and left
      # device/install.sh mutated in the worktree.
      - name: Prove the guards can still fail
        run: timeout 600 python3 tests/mutation_gate.py --tier fast
      # A mutated file left behind would be invisible here -- nothing else in
      # this job reads those files -- and is the worst bug this runner could
      # have. One line, and it is the property everything else rests on.
      - name: The tree must be exactly as it was
        if: always()
        run: git diff --exit-code

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned, not apt's. The runner image's shellcheck floats, and the
      # versions genuinely disagree: 0.9.0 emits SC2015 where 0.11.0 does
      # not, so a local run can be clean while CI fails on the same commit.
      # Bump this deliberately, with the scripts fixed in the same commit.
      - name: Check the provisioning and image scripts
        env:
          SHELLCHECK_VERSION: v0.9.0
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          ./shellcheck --version
          # img-local-rig.sh is LINTED here and never run: it is a
          # debugging tool with no CI wiring by design (issue #22), and
          # running it would put a network fetch and an emulated boot on
          # every push -- which is the cost it exists to remove.
          ./shellcheck device/install.sh device/persist-identity.sh \
                       image/build.sh image/render-manual.sh \
                       harness/kernel-sim.sh harness/vm-check.sh \
                       harness/vm-guest-check.sh harness/img-boot.sh \
                       harness/img-guest-check.sh harness/img-local-rig.sh

  hardware:
    # Tier 1 of the harness: the real code against real kernel interfaces
    # and a real cupsd. This is the job that would have caught `MaxJobs 1`
    # -- six rounds of reading the code did not, and a daemon did in four
    # seconds. See harness/README.md.
    runs-on: ubuntu-latest
    # 18 so the pytest step's own `timeout 600` below always fires first:
    # setup (apt, the cups stack, linux-modules-extra, pips, sim bring-up)
    # runs ~2-4 minutes, so the inner cap lands by ~14 and the failure()
    # diagnostics still have room. Under a cap smaller than setup + inner
    # timeout, a hung test gets the JOB cancelled instead -- failure() is
    # false on cancellation, so the CUPS error-log step is skipped and the
    # hang loses its diagnosis. Found by the review panel: the previous
    # 15 made the old inner `timeout 900` unreachable dead code.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CUPS, the panel libraries and the simulators
        run: |
          sudo apt-get update
          # cups for the print path; the rest is what the unit imports on a
          # real Pi, so the panel code can be exercised rather than skipped.
          sudo apt-get install -y --no-install-recommends \
            cups cups-client cups-filters printer-driver-cups-pdf \
            i2c-tools python3-evdev
          # gpio-sim, i2c-stub and vkms are not in the runner's base kernel
          # -- measured: "1 of 4 up" on 6.17.0-1020-azure, with only uinput
          # present. They live in modules-extra. Not fatal if it will not
          # install; kernel-sim.sh reports what it got and the tests skip
          # what is missing.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            || echo "no modules-extra for $(uname -r); some simulators will be absent"
          pip install -r requirements-dev.txt
          pip install smbus2 luma.oled gpiozero lgpio
      - name: The panel tests that need gpiozero and lgpio
        # tests/test_hardware.py is nobody's job otherwise. It carries no
        # `hardware` marker, so the harness step below (`pytest -m
        # hardware`) deselects the whole file; and the `test` job installs
        # requirements-dev.txt, which deliberately has neither gpiozero nor
        # lgpio. Measured by blocking both imports: the file goes to 9
        # skipped -- the five [lgpio] parametrisations and all four
        # TestRealGpiozero tests, seven of them added by the panel-guard
        # change. Among them is the control that proves real gpiozero lets a
        # callback exception straight out, which is the only thing keeping
        # the stand-in dispatcher honest, and lgpio's own `run`. This step
        # is the one place they run.
        #
        # Both libraries are installed above, so nothing in the file has a
        # reason to skip -- and a skip is failed here rather than printed,
        # because that is exactly how these tests came to run nowhere: a
        # skipped test and a passing one look the same in a summary line.
        run: |
          set -o pipefail
          timeout 300 python3 -m pytest -q -p no:randomly -rs \
            tests/test_hardware.py 2>&1 | tee /tmp/panel.log
          if grep -qE '[0-9]+ skipped' /tmp/panel.log; then
            echo "tests/test_hardware.py skipped something. With gpiozero" >&2
            echo "and lgpio both installed, nothing in it may skip -- a" >&2
            echo "skip here means an install half-worked and the panel is" >&2
            echo "back to being tested by the stand-ins only." >&2
            grep -E '^SKIPPED' /tmp/panel.log >&2 || true
            exit 1
          fi
      - name: Stop the system CUPS and unconfine cupsd
        run: |
          # The rig runs its own cupsd on its own socket. The distro one is
          # not needed and only competes for the default socket.
          sudo systemctl stop cups cups-browsed || true
          # Ubuntu confines cupsd with AppArmor, and the profile permits
          # backends under /usr/lib/cups/backend and nowhere else. The rig
          # is deliberately hermetic -- its own ServerBin in a temp
          # directory -- which is exactly what that forbids. Measured:
          #   apparmor="DENIED" operation="exec" profile="/usr/sbin/cupsd"
          #   name="/tmp/.../cups/bin/backend/usb" comm="cups-deviced"
          # so cupsd started, answered lpstat, and reported no devices.
          #
          # apparmor_parser rather than aa-complain: the latter needs
          # apparmor-utils, which is not on the runner, and the `|| true`
          # meant its absence was silent.
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.cupsd 2>/dev/null || true
          # Assert it worked. If this step ever silently fails, the rig
          # skips its tests for lack of a working cupsd and the job goes
          # green having tested nothing -- which is worse than red.
          #
          # sudo on the grep, not just the parser. That file is root-only,
          # so an unprivileged grep exits non-zero with "Permission denied"
          # and the assertion reads it as "not enforcing" -- an assertion
          # that cannot observe the state it is asserting about. It passed
          # for the wrong reason on the first green run.
          PROFILES=/sys/kernel/security/apparmor/profiles
          if ! sudo test -r "$PROFILES"; then
            echo "cannot read $PROFILES; assuming no AppArmor on this runner"
          elif sudo grep -q '^/usr/sbin/cupsd (enforce)' "$PROFILES"; then
            echo "cupsd is still confined; the harness cannot run hermetically" >&2
            sudo grep cupsd "$PROFILES" >&2
            exit 1
          else
            echo "cupsd apparmor state: $(sudo grep cupsd "$PROFILES" || echo unconfined)"
          fi
      - name: Bring up the kernel simulators
        # Never fatal: a runner kernel missing one of these should still
        # run everything else. The script reports what it got.
        run: sudo ./harness/kernel-sim.sh up
      - name: What came up
        run: sudo ./harness/kernel-sim.sh status
      - name: Run the harness
        # Root because cupsd runs backends as lp and the simulators are
        # driven through sysfs. -p no:randomly so a failure is reproducible.
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" \
            timeout 600 python3 -m pytest -m hardware -v -p no:randomly \
              --tb=short -rfs 2>&1 | tee /tmp/harness.log
      # The rig's own honesty, checked the same way the fast guards are: a
      # rig that has stopped reproducing the shipped configuration, or
      # stopped being able to make a job fail, is a green job that tested
      # nothing -- which is worse than a red one, and is the premise of this
      # whole harness. Here rather than in the `mutation` job because this is
      # the only place with a working cupsd, and it costs 36 seconds measured
      # against a job that runs in about eight minutes.
      - name: Prove the rig's guards can still fail
        run: |
          sudo -E env "PATH=$PATH" \
            timeout 600 python3 tests/mutation_gate.py --tier hardware
      - name: The tree must be exactly as it was
        if: always()
        run: git diff --exit-code
      - name: The CUPS error log, if anything failed
        if: failure()
        # Tightly capped. CUPS dumps its whole debug trace for a failed job
        # regardless of LogLevel, and one rig per test meant ~1000 lines of
        # it -- which pushed the pytest summary out of reach of anything
        # reading the tail of this log. A diagnostic nobody can find past
        # the noise is not a diagnostic. Two files, twenty lines each.
        run: |
          sudo find /tmp -name error_log -path '*cups*' 2>/dev/null \
            | head -n 2 \
            | while read -r log; do
                echo "--- $log"
                sudo grep -E '^[EW] ' "$log" | tail -n 20 || true
              done
          echo "--- apparmor denials (cupsd only)"
          sudo dmesg 2>/dev/null | grep -i 'apparmor="DENIED"' | tail -n 10 || true
      - name: Tear down
        if: always()
        run: sudo ./harness/kernel-sim.sh down || true
      - name: Verdict
        # Last thing in the job log, always, so the outcome is reachable
        # from the tail without wading through the CUPS dump above.
        if: always()
        run: |
          echo "=== harness verdict ==="
          # Not `grep ... | tail || echo`: under Actions' default shell
          # (no pipefail) the pipeline's status is tail's, which is 0 on
          # empty input, so a missing log read as a clean run.
          if [ ! -s /tmp/harness.log ]; then
            echo "no pytest output at all -- the harness did not run" >&2
            exit 1
          fi
          grep -E "^(FAILED|ERROR|SKIPPED)|passed|failed" /tmp/harness.log \
            | tail -n 40 || true
          # A floor on what must have RUN. cupsrig.available() skips the
          # whole CUPS half for five separate reasons -- a confined cupsd,
          # a non-root runner, a missing binary -- and each of them left
          # this job green at "1 passed, 20 skipped", the one pass being a
          # bash -n syntax check. A harness that silently tests nothing is
          # worse than a red one; that is the premise of this whole PR.
          #
          # 33, raised from 12 when the rig learned to FAIL. The CUPS half
          # is now 37 tests (8 print path + 4 unattended + 12 failure-mode
          # shapes + 7 failed-copy + 5 panel + the shipped-config check,
          # which the first count of this forgot), and the four kernel
          # simulators add 7 more where the runner's kernel has them.
          # Measured on a runner-shaped container: 37 passed, 7 skipped for
          # absent simulators, 176s. The floor sits just under the CUPS
          # half deliberately -- it is there to catch that half vanishing,
          # not to police the exact count, which every new test changes.
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/harness.log | tail -1 | cut -d' ' -f1)
          echo "harness tests passed: ${PASSED:-0}"
          # 55, and derived from a count rather than from the tail of an
          # old run -- the last three numbers here were all wrong, in
          # both directions, because they were carried forward by hand
          # while the harness kept growing. `pytest -m hardware
          # --collect-only` on this tree collects 61.
          #
          # Measured on a kernel with NO simulators at all (this
          # container: CONFIG_GPIOLIB and CONFIG_CONFIGFS_FS unset):
          # 50 passed, 11 skipped -- the 7 gpio-sim tests, 2 i2c-stub,
          # 1 vkms, 1 uinput. A runner with modules-extra runs all
          # eleven, so 61 is what this job should see.
          #
          # 55 leaves six free to skip for a reason already seen and
          # accepted, and no more: the debounce test on a box too slow
          # to bounce a line inside the window, the unaided-chip-number
          # test when gpio-sim does not land on gpiochip0, luma refusing
          # the i2c stub, and a runner kernel without modules-extra
          # losing i2c-stub, vkms and uinput together.
          #
          # If this number needs changing again, COUNT -- do not adjust
          # it to match whatever the last run happened to print, which
          # is how it came to claim the CUPS rig was 37 tests.
          if [ "${PASSED:-0}" -lt 55 ]; then
            echo "expected at least 55 passing harness tests (the CUPS rig" >&2
            echo "alone is 13); got ${PASSED:-0}. Something skipped silently." >&2
            grep -E "^SKIPPED" /tmp/harness.log >&2 || true
            exit 1
          fi
          # The panel by name, not only by count. Every run this repository
          # has ever done skipped these -- gpiozero will not build a pin
          # factory on a machine with no Pi revision -- and the CUPS half is
          # big enough to carry the total back over any floor while the
          # entire input surface of the device quietly stops being tested.
          # If a future runner kernel loses gpio-sim this goes red on
          # purpose; the reason will be in the lines it prints.
          #
          # The last of them is the guard against lgpio's dispatch
          # thread, which is a module-level singleton with no try around
          # its callback call: one exception out of a button callback
          # ends every button in the process for the life of the
          # process, and on a 512 MiB board with no swap making
          # 1000-page pads that exception is a MemoryError waiting to
          # happen. The fast tier proves the same property against a
          # stand-in dispatcher and against lgpio's own `run` fed
          # through a pipe; this is the only place it runs with a
          # kernel, a real gpiochip and the real gpiozero -> lgpio chain
          # all at once, so it is named here rather than left to the
          # count.
          for named in test_a_tap_on_up_arrives_as_up \
                       test_a_tap_on_down_arrives_as_down \
                       test_a_tap_on_ok_arrives_as_ok_not_back \
                       test_a_hold_on_ok_arrives_as_back_exactly_once \
                       test_a_raising_callback_does_not_kill_the_panel; do
            if ! grep -q "TestTheRealButtonPath::${named} PASSED" \
                 /tmp/harness.log; then
              echo "${named} did not pass. A real press on a simulated" >&2
              echo "line must reach a GpioButtons callback here, or this" >&2
              echo "job is not testing the panel at all." >&2
              grep -E "TestTheRealButtonPath|^SKIPPED" /tmp/harness.log >&2 \
                || true
              exit 1
            fi
          done

  vm:
    # Tier 2: boot a real system, run device/install.sh on it, and check
    # the unit actually comes up. This is the only place otp-unit.service
    # taking tty1 from getty is ever observed -- pi-gen never boots the
    # image it builds, and a container has no virtual terminals.
    runs-on: ubuntu-latest
    # 15, not 45. The script's own timeout is 600s and MUST fire
    # first: a job killed by GitHub's timeout skips its remaining
    # steps, so the console dump and the verdict would never run and
    # the diagnosis would be lost. This is the outer backstop only.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils
          # KVM turns half an hour of emulation into a few minutes. Not
          # fatal if it is missing -- vm-check.sh falls back to TCG and
          # says so -- but worth reporting, because a silent fallback
          # looks exactly like a hang.
          ls -l /dev/kvm 2>/dev/null || echo "no /dev/kvm; will use TCG"
          sudo usermod -aG kvm "$USER" || true
      - name: Cache the Debian base image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/otp-vm/base.qcow2
          key: debian-13-generic-amd64-v1
      - name: Boot, provision and check
        env:
          # An absolute path expanded by GitHub, not a ~ that nothing
          # expands. sudo -E would also hand root's HOME to the script.
          OTP_VM_WORK: ${{ runner.temp }}/otp-vm
        run: sudo -E ./harness/vm-check.sh
      - name: The guest console, if anything failed
        if: failure()
        # Capped: the console is thousands of lines of boot chatter, and an
        # uncapped dump pushed the verdict out of reach of anything reading
        # the tail of this log.
        run: |
          sudo grep -iE "error|fail|otp-" \
            ${{ runner.temp }}/otp-vm/console.log | tail -n 60 || true
      - name: Verdict
        # Last, always, so the outcome is the first thing you see from the end.
        if: always()
        run: |
          echo "=== tier 2 verdict ==="
          sudo cat ${{ runner.temp }}/otp-vm/verdict.txt 2>/dev/null \
            || echo "(the guest never reported)"

  simulator:
    # The unit's whole interface runs without hardware, so CI can drive a
    # pad pair end to end: roll a codeword, confirm, generate, print copy A,
    # swap, print copy B, wipe.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Drive a pad pair through the simulator
        run: |
          printf 'k\nk\nk\nk\nk\nk\nk\n' | timeout 120 python3 -m otpunit --sim > out.txt
          grep -q "PAIR COMPLETE" out.txt
          grep -q "POWER-CYCLE PRINTER" out.txt
      - name: A back press at the root menu must not exit
        run: |
          # An empty screen stack ends run(), which on the real unit means a
          # dark panel and three dead buttons until someone pulls the power.
          printf 'K\nK\nK\nk\n' | timeout 60 python3 -m otpunit --sim > back.txt
          grep -q "CODEWORD" back.txt

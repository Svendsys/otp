name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per branch: a superseded PR run is cancelled. Not cancelled on
# master, where each push is the record of what that commit does.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # mtools: tests/test_img_verdict.py builds a real FAT partition and
      # runs tier 3's card functions against it, and those tests skip
      # without it. tests/test_image_workflow.py asserts this step is here.
      - name: Install mtools for the tier-3 card tests
        # Capped and retried like every apt call in this file: apt's
        # default is a 120s per-connection timeout with no retry, so a
        # stalled mirror hangs the job silently.
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=15 \
                       -o Acquire::https::Timeout=15 update
          sudo apt-get install -y --no-install-recommends mtools
      # Bounded: a UI regression can make the suite spin rather than fail
      # (FakeButtons returns None forever at poll_seconds=0).
      - name: Run tests
        run: timeout 600 pytest -q

  mutation:
    # Break each load-bearing guard on purpose and require a test to go red.
    # See issue #14 and tests/mutations.toml.
    #
    # Per PR, not nightly: a gate that reports on the commit that broke the
    # guard is worth more than one that reports the next morning. A separate
    # job so the ordinary suite's wall clock does not move.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11+ for tomllib, which is why the table is TOML.
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # mtools, as in the `test` job. mutation_gate.py refuses a row whose
      # named tests skipped, so without it the card rows fail the job.
      - name: Install mtools for the tier-3 card rows
        # Capped and retried like every apt call in this file.
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=15 \
                       -o Acquire::https::Timeout=15 update
          sudo apt-get install -y --no-install-recommends mtools
      # Bounded: a mutation can wedge a test rather than fail it. The runner
      # caps each mutated run; this is the backstop. `timeout` sends SIGTERM,
      # which the runner turns into an unwind that restores the tree.
      - name: Prove the guards can still fail
        run: timeout 600 python3 tests/mutation_gate.py --tier fast
      # A mutated file left behind would be invisible to the rest of this job.
      - name: The tree must be exactly as it was
        if: always()
        run: git diff --exit-code

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Pinned, not apt's: shellcheck versions disagree (0.9.0 emits SC2015
      # where 0.11.0 does not). Bump deliberately, with the scripts fixed in
      # the same commit.
      - name: Check the provisioning and image scripts
        env:
          SHELLCHECK_VERSION: v0.9.0
        run: |
          # --retry-all-errors: plain --retry does not cover 403, which is
          # what a rate-limited release download returns, and tar would then
          # be handed an empty stream.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          ./shellcheck --version
          # img-local-rig.sh is linted here and never run: it has no CI
          # wiring by design (issue #22). The pi-gen stage script is listed
          # because its cloud-init purge logic (issue #34) never runs here.
          ./shellcheck device/install.sh device/persist-identity.sh \
                       image/build.sh image/render-manual.sh \
                       image/stage-otpunit/01-otpunit/00-run.sh \
                       harness/kernel-sim.sh harness/vm-check.sh \
                       harness/vm-guest-check.sh harness/img-boot.sh \
                       harness/img-guest-check.sh harness/img-local-rig.sh

  hardware:
    # Tier 1 of the harness: the real code against real kernel interfaces
    # and a real cupsd. See harness/README.md.
    runs-on: ubuntu-latest
    # The cap must exceed setup (8) plus both inner `timeout 600`s (10 + 10)
    # plus the failure() diagnostics, so the inner timeouts always fire
    # first: a job killed by GitHub's timeout is cancelled, failure() is
    # false, and the CUPS error-log step is skipped.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CUPS, the panel libraries and the simulators
        # Setup has its own cap so a collapsed mirror fails with this step's
        # name on it instead of eating the test budget.
        timeout-minutes: 8
        run: |
          # Retries and a timeout: apt's default is 120s per connection with
          # no retry, so a mirror that accepts a socket and stops talking
          # stalls `update` for minutes.
          sudo apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=15 \
                       -o Acquire::https::Timeout=15 update
          # cups for the print path; the rest is what the unit imports on a
          # real Pi, so the panel code is exercised rather than skipped.
          sudo apt-get install -y --no-install-recommends \
            cups cups-client cups-filters printer-driver-cups-pdf \
            i2c-tools python3-evdev
          # gpio-sim, i2c-stub and vkms live in modules-extra, not the
          # runner's base kernel. Not fatal: kernel-sim.sh reports what it
          # got and the tests skip what is missing.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" \
            || echo "no modules-extra for $(uname -r); some simulators will be absent"
          pip install -r requirements-dev.txt
          pip install smbus2 luma.oled gpiozero lgpio
      - name: The panel tests that need gpiozero and lgpio
        # tests/test_hardware.py runs fully only here: it has no `hardware`
        # marker, so the harness step deselects it, and the `test` job has
        # neither gpiozero nor lgpio. With both installed nothing may skip,
        # so a skip fails the step.
        run: |
          set -o pipefail
          timeout 300 python3 -m pytest -q -p no:randomly -rs \
            tests/test_hardware.py 2>&1 | tee /tmp/panel.log
          if grep -qE '[0-9]+ skipped' /tmp/panel.log; then
            echo "tests/test_hardware.py skipped something. With gpiozero" >&2
            echo "and lgpio both installed, nothing in it may skip -- a" >&2
            echo "skip here means an install half-worked and the panel is" >&2
            echo "back to being tested by the stand-ins only." >&2
            grep -E '^SKIPPED' /tmp/panel.log >&2 || true
            exit 1
          fi
      - name: Stop the system CUPS and unconfine cupsd
        run: |
          # The rig runs its own cupsd on its own socket; the distro one only
          # competes for the default socket.
          sudo systemctl stop cups cups-browsed || true
          # Ubuntu's AppArmor profile lets cupsd exec backends only under
          # /usr/lib/cups/backend, and the rig's ServerBin is a temp
          # directory. apparmor_parser, not aa-complain, which needs
          # apparmor-utils.
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.cupsd 2>/dev/null || true
          # Assert it worked, or the rig skips for lack of a working cupsd
          # and the job goes green having tested nothing. sudo on the grep:
          # the profiles file is root-only.
          PROFILES=/sys/kernel/security/apparmor/profiles
          if ! sudo test -r "$PROFILES"; then
            echo "cannot read $PROFILES; assuming no AppArmor on this runner"
          elif sudo grep -q '^/usr/sbin/cupsd (enforce)' "$PROFILES"; then
            echo "cupsd is still confined; the harness cannot run hermetically" >&2
            sudo grep cupsd "$PROFILES" >&2
            exit 1
          else
            echo "cupsd apparmor state: $(sudo grep cupsd "$PROFILES" || echo unconfined)"
          fi
      - name: Bring up the kernel simulators
        # Never fatal: the script reports what it got.
        run: sudo ./harness/kernel-sim.sh up
      - name: What came up
        run: sudo ./harness/kernel-sim.sh status
      - name: Run the harness
        # Root because cupsd runs backends as lp and the simulators are
        # driven through sysfs. -p no:randomly so a failure is reproducible.
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" \
            timeout 600 python3 -m pytest -m hardware -v -p no:randomly \
              --tb=short -rfs 2>&1 | tee /tmp/harness.log
      # The rig's own guards, mutation-tested here because this is the only
      # job with a working cupsd.
      - name: Prove the rig's guards can still fail
        run: |
          sudo -E env "PATH=$PATH" \
            timeout 600 python3 tests/mutation_gate.py --tier hardware
      - name: The tree must be exactly as it was
        if: always()
        run: git diff --exit-code
      - name: The CUPS error log, if anything failed
        if: failure()
        # Tightly capped: CUPS dumps its whole debug trace for a failed job
        # regardless of LogLevel, which would bury the pytest summary.
        run: |
          sudo find /tmp -name error_log -path '*cups*' 2>/dev/null \
            | head -n 2 \
            | while read -r log; do
                echo "--- $log"
                sudo grep -E '^[EW] ' "$log" | tail -n 20 || true
              done
          echo "--- apparmor denials (cupsd only)"
          sudo dmesg 2>/dev/null | grep -i 'apparmor="DENIED"' | tail -n 10 || true
      - name: Tear down
        if: always()
        run: sudo ./harness/kernel-sim.sh down || true
      - name: Verdict
        # Last in the job log, always, so the outcome is at the tail.
        if: always()
        run: |
          echo "=== harness verdict ==="
          # Not `grep ... | tail || echo`: without pipefail the pipeline's
          # status is tail's, which is 0 on empty input.
          if [ ! -s /tmp/harness.log ]; then
            echo "no pytest output at all -- the harness did not run" >&2
            exit 1
          fi
          grep -E "^(FAILED|ERROR|SKIPPED)|passed|failed" /tmp/harness.log \
            | tail -n 40 || true
          # A floor on what must have run: cupsrig.available() can skip the
          # whole CUPS half and leave this job green.
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/harness.log | tail -1 | cut -d' ' -f1)
          echo "harness tests passed: ${PASSED:-0}"
          # 55 of the 61 that `pytest -m hardware --collect-only` collects.
          # A kernel with no simulators skips 11; the floor leaves six free
          # to skip for accepted reasons (slow debounce, gpio-sim not on
          # gpiochip0, luma refusing the i2c stub, no modules-extra). If
          # this needs changing, count again; do not copy the last run.
          if [ "${PASSED:-0}" -lt 55 ]; then
            echo "expected at least 55 passing harness tests (the CUPS rig" >&2
            echo "alone is 13); got ${PASSED:-0}. Something skipped silently." >&2
            grep -E "^SKIPPED" /tmp/harness.log >&2 || true
            exit 1
          fi
          # The panel by name, not only by count: the CUPS half is big
          # enough to clear any floor while every button test skips. The
          # last one is the only run of the raising-callback guard against
          # a real gpiochip and the real gpiozero -> lgpio chain.
          for named in test_a_tap_on_up_arrives_as_up \
                       test_a_tap_on_down_arrives_as_down \
                       test_a_tap_on_ok_arrives_as_ok_not_back \
                       test_a_hold_on_ok_arrives_as_back_exactly_once \
                       test_a_raising_callback_does_not_kill_the_panel; do
            if ! grep -q "TestTheRealButtonPath::${named} PASSED" \
                 /tmp/harness.log; then
              echo "${named} did not pass. A real press on a simulated" >&2
              echo "line must reach a GpioButtons callback here, or this" >&2
              echo "job is not testing the panel at all." >&2
              grep -E "TestTheRealButtonPath|^SKIPPED" /tmp/harness.log >&2 \
                || true
              exit 1
            fi
          done

  vm:
    # Tier 2: boot a real system, run device/install.sh on it, and check
    # the unit comes up. The only place otp-unit.service taking tty1 from
    # getty is observed.
    runs-on: ubuntu-latest
    # The outer backstop only. The script's own 600s timeout must fire
    # first: a job killed by GitHub's timeout skips the console dump and
    # the verdict. Setup is capped separately below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        # See the hardware job: setup is not test time.
        timeout-minutes: 8
        run: |
          # Retries and a timeout, as in the hardware job.
          sudo apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=15 \
                       -o Acquire::https::Timeout=15 update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils
          # KVM makes the boot minutes rather than half an hour. Not fatal:
          # vm-check.sh falls back to TCG and says so.
          ls -l /dev/kvm 2>/dev/null || echo "no /dev/kvm; will use TCG"
          sudo usermod -aG kvm "$USER" || true
      - name: Cache the Debian base image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/otp-vm/base.qcow2
          key: debian-13-generic-amd64-v1
      - name: Boot, provision and check
        env:
          # An absolute path expanded by GitHub, not a ~ that nothing
          # expands. sudo -E would also hand root's HOME to the script.
          OTP_VM_WORK: ${{ runner.temp }}/otp-vm
        run: sudo -E ./harness/vm-check.sh
      - name: The guest console, if anything failed
        if: failure()
        # Capped, so the dump does not bury the verdict.
        run: |
          sudo grep -iE "error|fail|otp-" \
            ${{ runner.temp }}/otp-vm/console.log | tail -n 60 || true
      - name: Verdict
        # Last, always, so the outcome is at the tail of the log.
        if: always()
        run: |
          echo "=== tier 2 verdict ==="
          sudo cat ${{ runner.temp }}/otp-vm/verdict.txt 2>/dev/null \
            || echo "(the guest never reported)"

  simulator:
    # The unit's whole interface runs without hardware, so CI can drive a
    # pad pair end to end: roll a codeword, confirm, generate, print copy A,
    # swap, print copy B, wipe.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Drive a pad pair through the simulator
        run: |
          printf 'k\nk\nk\nk\nk\nk\nk\n' | timeout 120 python3 -m otpunit --sim > out.txt
          grep -q "PAIR COMPLETE" out.txt
          grep -q "POWER-CYCLE PRINTER" out.txt
      - name: A back press at the root menu must not exit
        run: |
          # An empty screen stack ends run(), which on the real unit means a
          # dark panel and three dead buttons until someone pulls the power.
          printf 'K\nK\nK\nk\n' | timeout 60 python3 -m otpunit --sim > back.txt
          grep -q "CODEWORD" back.txt

name: Build image

# Deliberately not on every push: the pi-gen build takes roughly half an
# hour and needs ~10GB of disk. Run it by hand, or on a tag to attach an
# image to a release.
#
# ...but ALSO on any pull request that touches what goes into the image.
# Until this was added, nothing checked the image on the PR that broke it:
# a change to install.sh or the pi-gen stage sailed through CI and was
# found at release time, or on a Pi. Path-filtered so the cost falls only
# on the PRs that can actually cause it -- everything else still gets the
# five fast jobs in ci.yml and nothing here.
#
# Not otpunit/** on purpose. The image bakes the package in, but a change
# there breaks the UNIT, not the image build, and tiers 1 and 2 answer that
# in minutes rather than half an hour.
#
# THE BUDGET IS TEN MINUTES. Not per job -- per PR, wall clock, for a
# change that does not alter what goes into the image. Two things buy that,
# and both are below: the image is CACHED on the inputs that actually
# affect it, and the boot is CAPPED.
#
# The honest exception: a PR that really does change the image pays for a
# real pi-gen build, and no amount of arranging makes that fit in ten
# minutes. Those are rare. Everything else -- harness work, tests, docs --
# restores the cache and skips straight to the boot.
#
# `push: master` exists to populate that cache. Caches created on a PR
# branch are visible only to that PR; caches on the base branch are visible
# to every PR. Without a master build the first run on each new PR would
# always miss, which is most of the cost this is trying to remove. It also
# validates the image just after a merge, which nothing did before.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [master]
  pull_request:
    paths:
      - "image/**"
      - "device/**"
      - "harness/img-boot.sh"
      - ".github/workflows/image.yml"

# Same reasoning as ci.yml, and more so: this one is a 35-minute build.
# Leaving a superseded pi-gen run going costs half an hour of runner time
# to produce an image for a commit that has already been replaced. Tag and
# dispatch runs are never cancelled -- those produce artifacts people keep.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    # NATIVE arm64, not x86 emulating it. This repository is public, and
    # GitHub's arm64 runners are free for public repositories.
    #
    # pi-gen builds an arm64 filesystem. On an x86 runner every binary it
    # executes goes through qemu-user, which is where the bulk of a
    # thirty-three minute build went -- and it needs four steps of
    # binfmt_misc setup, with a comment block longer than most of this file,
    # to work at all. Natively none of that applies: the steps below are
    # kept but skipped, so the workflow still runs on x86 if it has to.
    runs-on: ubuntu-24.04-arm
    # Was 120. A budget nobody can exceed is not a budget. This is the hard
    # stop for the expensive case (a real rebuild); the cached case should
    # come in near seven minutes and is reported against the ten-minute bar
    # at the end of the job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # --- can we skip the expensive half entirely? -------------------
      #
      # Keyed on what actually ends up IN the image. A change to
      # harness/img-boot.sh, to a test, or to a doc leaves this key alone,
      # so the boot runs against the same image the previous run built --
      # which is exactly right, and is the difference between iterating on
      # the harness in seven minutes and in fifty-five.
      #
      # otpunit/ and the codewords ARE included even though they are not in
      # the PR trigger. They are baked into the image, so an image built
      # before they changed is the wrong image to boot, even if the build
      # would have succeeded either way. The trigger answers "is this worth
      # checking"; the key answers "is this image still current".
      - name: Restore a previously built image
        id: imgcache
        uses: actions/cache@v4
        with:
          path: image/deploy
          key: otp-image-${{ runner.arch }}-${{ hashFiles('image/**', 'device/**', 'otpunit/**', 'codewords/**', 'otp_generator.py', 'otp.md') }}

      - name: Free up disk space
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # Two separate requirements, and it takes both. They are not
      # alternatives, which is what the previous attempt got wrong.
      #
      # 1. The registration must carry binfmt_misc's F (fix binary) flag.
      #    pi-gen's build.sh runs `arch-test arm64` INSIDE the build
      #    container; without F the kernel resolves the interpreter path in
      #    the caller's mount namespace, where it does not exist, and the
      #    test fails with "not supported on this machine/kernel".
      #    update-binfmts does not set F, so installing binfmt-support is
      #    not a substitute -- registering from a container is.
      #
      # 2. The interpreter must ALSO exist on the host PATH, because
      #    build-docker.sh runs `which qemu-aarch64` and exits 1 without
      #    it. Note the non-static name: qemu-user-static ships only
      #    qemu-aarch64-static and does not satisfy this.
      #
      # Order matters. binfmt first, then the host binary, and deliberately
      # without binfmt-support so nothing re-registers over the F entry.
      # binfmt_misc has to be mounted ON THE HOST, not just inside the
      # container that registers it. build-docker.sh greps
      # /proc/sys/fs/binfmt_misc/qemu-aarch64* and, when that glob matches
      # nothing, writes its own registration to .../register behind
      # `2>/dev/null || true` -- so an unmounted binfmt_misc produces no
      # error at all, just the arm64-unsupported failure two steps later.
      - name: Mount binfmt_misc on the host
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          sudo modprobe binfmt_misc || true
          mountpoint -q /proc/sys/fs/binfmt_misc \
            || sudo mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc
          mountpoint /proc/sys/fs/binfmt_misc

      # --no-install-recommends is load-bearing, not tidiness. qemu-user
      # RECOMMENDS qemu-user-binfmt, which registers its own handler:
      #
      #   interpreter /usr/libexec/qemu-binfmt/aarch64-binfmt-P
      #   flags: PO
      #
      # No F flag, so it cannot work inside the build container -- and
      # because it is registered last it takes precedence over the one that
      # can. That entry, pulled in by a Recommends nobody asked for, is
      # what broke the previous two runs. It also explains the failing
      # grep in build-docker.sh, which looks for /usr/bin/qemu-aarch64 and
      # never sees that wrapper path.
      - name: Install the qemu interpreter on the host PATH
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          which qemu-aarch64
          dpkg -l | grep -q qemu-user-binfmt && {
            echo "qemu-user-binfmt got installed anyway; it will clobber the F entry" >&2
            exit 1
          } || true

      # Registered LAST, so nothing can overwrite it, and with exactly one
      # handler for the magic so there is no precedence question at all.
      - name: Register arm64 binfmt with the fix-binary flag
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          if [ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "removing pre-existing registration"
            echo -1 | sudo tee /proc/sys/fs/binfmt_misc/qemu-aarch64 >/dev/null
          fi
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          # The F flag is the whole point. Assert it rather than hope.
          grep -q '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64

      # Reproduce pi-gen's own check before spending half an hour on it.
      # build.sh runs `arch-test arm64` inside the build container, and
      # that is the only thing that actually proves the registration is
      # usable from another mount namespace.
      - name: Prove arm64 emulation works from inside a container
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          echo "== registrations visible on the host =="
          for f in /proc/sys/fs/binfmt_misc/qemu-aarch64*; do
            [ -e "$f" ] && { echo "--- $f"; cat "$f"; }
          done
          echo "== pi-gen's check, in a container =="
          docker run --privileged --rm debian:trixie-slim bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq arch-test
            mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
            arch-test arm64
          '

      - name: Install manual rendering tools
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y pandoc weasyprint

      - name: Build
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: ./image/build.sh

      # The artifact is uploaded and attached BEFORE the image is booted, so
      # that a failing boot can be reported honestly without costing anyone
      # the image. See the boot step below for why that ordering matters.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otp-print-unit-image
          path: image/deploy/*.img.xz
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: image/deploy/*.img.xz

      # Tier 3 of the harness: boot the artifact that was just built. Once
      # per image, not per commit -- it is emulated, so it is slow, and its
      # peripheral coverage is WORSE than tier 1's simulators. It answers
      # exactly one question nothing else can: does the thing that gets
      # flashed to a card actually come up? pi-gen assembles a filesystem
      # and never starts it. See harness/README.md.
      #
      # LAST, AND ALLOWED TO FAIL LOUDLY. This step used to run before the
      # upload with `continue-on-error: true`, so that an unvalidated check
      # could not cost anyone the image. The effect on its first real run
      # was worse than the problem it solved: tier 3 exited 1, and the job
      # went green with the GitHub API reporting this step's conclusion as
      # `success`. Anyone reading the status rather than the log would have
      # concluded the image booted. That is a check that cannot fail --
      # exactly what the rest of this harness exists to eliminate.
      #
      # Moving it after the upload gets both things: the artifact is already
      # safe, so a red boot costs nothing, and the boot can therefore be
      # honest about failing.
      #
      # CAPPED AT SIX MINUTES, and that cap is a policy rather than an
      # estimate. The budget for a cached run is ten minutes end to end;
      # restoring and decompressing the image takes about one, so this is
      # what is left. A boot that cannot come up inside six minutes of
      # emulation is a boot this tier will report as failing -- which is a
      # deliberate choice, not an oversight. If the image genuinely needs
      # longer, that is a finding about the image, and the console-growth
      # sampling in img-boot.sh will say whether it was progressing.
      - name: Boot the image
        env:
          OTP_IMG_TIMEOUT: 360
        run: |
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm mtools xz-utils
          OTP_IMG_WORK=${{ runner.temp }}/otp-img \
            ./harness/img-boot.sh image/deploy/*.img.xz
      - name: Boot verdict
        if: always()
        # Also to the step summary, which is on the run's landing page. The
        # verdict being in the log was not enough: the one line that
        # explained the first failure was thirty lines up and easy to scroll
        # past, and this repository keeps rediscovering that a diagnostic
        # nobody can find is not a diagnostic.
        run: |
          echo "=== tier 3 verdict ==="
          CACHED='${{ steps.imgcache.outputs.cache-hit }}'
          if [ "$CACHED" = "true" ]; then
            BUILT="restored from cache (no pi-gen build)"
          else
            BUILT="built from source (pi-gen ran)"
          fi
          {
            echo "## Tier 3 — booting the built image"
            echo
            echo "Image: **$BUILT**"
            echo
            echo '```'
            cat ${{ runner.temp }}/otp-img/verdict.txt 2>/dev/null \
              || echo "(the image never reported)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The bar, stated where it can be seen. Ten minutes is the budget for
      # a run that did not have to rebuild the image; a run that did is
      # expected to exceed it and says so rather than failing for it.
      # Reported rather than enforced: failing an otherwise-good job for
      # being slow teaches people to ignore the number.
      - name: Time budget
        if: always()
        run: |
          CACHED='${{ steps.imgcache.outputs.cache-hit }}'
          {
            echo
            if [ "$CACHED" = "true" ]; then
              echo "Budget: **10 minutes** (cached image). See the job duration above."
            else
              echo "Budget: not applicable — this run rebuilt the image from"
              echo "source, which does not fit in ten minutes and is not"
              echo "expected to. Only PRs that change what goes INTO the"
              echo "image pay this."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

name: Build image

# Deliberately not on every push: the pi-gen build needs ~10GB of disk.
# Run it by hand, or on a tag to attach an image to a release.
#
# ...but ALSO on any pull request that touches what goes into the image.
# Until this was added, nothing checked the image on the PR that broke it:
# a change to install.sh or the pi-gen stage sailed through CI and was
# found at release time, or on a Pi. Path-filtered so the cost falls only
# on the PRs that can actually cause it -- everything else still gets the
# five fast jobs in ci.yml and nothing here.
#
# Not otpunit/** on purpose. The image bakes the package in, but a change
# there breaks the UNIT, not the image build, and tiers 1 and 2 answer that
# in seconds. (It IS in the cache key below -- see the note there.)
#
# THE BUDGET IS TEN MINUTES. Not per job -- per PR, wall clock, for a
# change that does not alter what goes into the image. Two things buy that,
# and both are below: the image is CACHED on the inputs that actually
# affect it, and the boot is CAPPED.
#
# There used to be an honest exception here: a PR that really changes the
# image pays for a full pi-gen build, and on x86 that could not fit in ten
# minutes. On a native arm64 runner it does -- measured 8m24s end to end,
# 7m24s of it pi-gen, against 55m45s for the same work on x86. The budget
# holds for both cases, so the exception is gone.
#
# `push: master` exists to populate that cache. Caches created on a PR
# branch are visible only to that PR; caches on the base branch are visible
# to every PR. Without a master build the first run on each new PR would
# always miss, which is most of the cost this is trying to remove. It also
# validates the image just after a merge, which nothing did before.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [master]
  pull_request:

# Same reasoning as ci.yml. Leaving a superseded pi-gen run going burns
# runner time producing an image for a commit that has already been
# replaced. Tag and dispatch runs are never cancelled -- those produce
# artifacts people keep.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection requires a check called `image`, and this workflow
  # used to be path-filtered at the trigger. A PR touching none of those
  # paths therefore never ran it, the required check never reported, and
  # the PR could not be merged at all -- not "merged without the image
  # being built", merged never. Five were stuck behind it.
  #
  # Dropping the requirement would have been the easy fix and the wrong
  # one: the tier-3 boot verdict is a release gate (issue #19) and
  # weakening it to unblock a merge queue is the trade this repository
  # exists to refuse. So the filter moved from the trigger, where it
  # suppressed the report, to a job, where it only suppresses the WORK:
  #
  #   changes -> did anything that goes into the image change?
  #   build   -> the expensive arm64 pi-gen build and boot, if it did
  #   image   -> always runs, always reports, and is the required check
  #
  # The cost profile is unchanged -- a docs-only PR still pays for no
  # pi-gen build, just for one cheap ubuntu-latest job that says so.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs a base to compare against, and the default
          # shallow clone does not have one.
          fetch-depth: 0
      - name: Does anything in this change reach the image?
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A tag, a push to master (which populates the cache every
            # PR then restores from), or a manual dispatch. All three
            # want the real thing.
            echo "${{ github.event_name }}: building unconditionally"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.base_ref }}"
          git fetch --no-tags --prune origin \
            "+refs/heads/$base:refs/remotes/origin/$base"
          # merge-base, not a two-dot diff: what THIS branch changed,
          # not everything that landed on master since it forked.
          changed=$(git diff --name-only \
            "$(git merge-base "origin/$base" HEAD)" HEAD)
          echo "$changed"
          # The same four paths the trigger used to carry.
          # harness/img-guest-check.sh is in this list because it is IN the
          # image: the pi-gen stage copies harness/ into the rootfs and
          # install.sh installs the probe to /opt/otp-unit, where a unit runs
          # it every tier-3 boot. It arrived with the overlay work and this
          # filter was not updated, so a pull request that changed only the
          # probe skipped the image job entirely -- the one job that runs it.
          if printf '%s\n' "$changed" | grep -qE \
              '^(image/|device/|harness/img-boot\.sh$|harness/img-guest-check\.sh$|\.github/workflows/image\.yml$)'
          then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing here goes into the image"
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # NATIVE arm64, not x86 emulating it. This repository is public, and
    # GitHub's arm64 runners are free for public repositories.
    #
    # pi-gen builds an arm64 filesystem. On an x86 runner every binary it
    # executes goes through qemu-user, which is where the bulk of a
    # thirty-three minute build went -- and it needs four steps of
    # binfmt_misc setup, with a comment block longer than most of this file,
    # to work at all. Natively none of that applies: the steps below are
    # kept but skipped, so the workflow still runs on x86 if it has to.
    needs: changes
    # The expensive half, and the only part that is conditional. When
    # this is skipped the `image` job below still runs and still reports.
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    # The job cap must always lose the race to the script timeout, or a
    # timeout costs the diagnosis as well as the run -- learned the hard
    # way when a 15-minute cap fired before the boot script's own timeout,
    # cancelled qemu mid-experiment, and skipped the verdict and the
    # evidence upload (failure() is false on cancellation).
    #
    # TWO boots now, for the read-only overlay (issue #9): the second is a
    # power-cycle of the same card, and the backstop is per boot. The
    # arithmetic that sizes this is the WORST case, where neither boot ever
    # reports: ~10 minutes of non-boot work on a cache-miss rebuild
    # (checkout, apt, pi-gen, cache save, upload, decompress) + 2 x (600s
    # backstop + timeout's 30s kill grace) + verdict overhead = ~31.5, so 40
    # keeps the same kind of margin 25 gave one boot.
    #
    # Healthy runs are nowhere near it, and that is measured rather than
    # hoped: run 31752321387, a cache MISS with both boots, took 16m16s end
    # to end -- 6m58s of pi-gen and 7m59s for the pair of boots, because the
    # harness stops each one the moment its guest check reports done.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # --- can we skip the expensive half entirely? -------------------
      #
      # Keyed on what actually ends up IN the image. A change to
      # harness/img-boot.sh, to a test, or to a doc leaves this key alone,
      # so the boot runs against the same image the previous run built --
      # which is exactly right, and skips the build entirely.
      #
      # harness/img-guest-check.sh is the exception in that directory, and it
      # is named separately below rather than by widening the pattern to
      # harness/**. The probe RUNS INSIDE the image: the pi-gen stage copies
      # harness/ into the rootfs and install.sh installs it to /opt/otp-unit.
      # Without it in the key, editing a check restored yesterday's image and
      # booted yesterday's probe -- and the harness then fails the run for
      # named checks the guest never emitted, which reads as a broken image
      # rather than a stale cache.
      #
      # human_bias.png is in the key because otp.md embeds it and
      # render-manual.sh bakes it into the manual PDFs inside the image --
      # a chart-only change must not green-certify (or tag-release) a
      # stale image. Found by the review panel.
      #
      # otpunit/ and the codewords ARE included even though they are not in
      # the PR trigger. They are baked into the image, so an image built
      # before they changed is the wrong image to boot, even if the build
      # would have succeeded either way. The trigger answers "is this worth
      # checking"; the key answers "is this image still current".
      - name: Restore a previously built image
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: image/deploy
          key: otp-image-${{ runner.arch }}-${{ hashFiles('image/**', 'device/**', 'otpunit/**', 'codewords/**', 'harness/img-guest-check.sh', 'otp_generator.py', 'otp.md', 'human_bias.png') }}

      - name: Free up disk space
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # Two separate requirements, and it takes both. They are not
      # alternatives, which is what the previous attempt got wrong.
      #
      # 1. The registration must carry binfmt_misc's F (fix binary) flag.
      #    pi-gen's build.sh runs `arch-test arm64` INSIDE the build
      #    container; without F the kernel resolves the interpreter path in
      #    the caller's mount namespace, where it does not exist, and the
      #    test fails with "not supported on this machine/kernel".
      #    update-binfmts does not set F, so installing binfmt-support is
      #    not a substitute -- registering from a container is.
      #
      # 2. The interpreter must ALSO exist on the host PATH, because
      #    build-docker.sh runs `which qemu-aarch64` and exits 1 without
      #    it. Note the non-static name: qemu-user-static ships only
      #    qemu-aarch64-static and does not satisfy this.
      #
      # Order matters. binfmt first, then the host binary, and deliberately
      # without binfmt-support so nothing re-registers over the F entry.
      # binfmt_misc has to be mounted ON THE HOST, not just inside the
      # container that registers it. build-docker.sh greps
      # /proc/sys/fs/binfmt_misc/qemu-aarch64* and, when that glob matches
      # nothing, writes its own registration to .../register behind
      # `2>/dev/null || true` -- so an unmounted binfmt_misc produces no
      # error at all, just the arm64-unsupported failure two steps later.
      - name: Mount binfmt_misc on the host
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          sudo modprobe binfmt_misc || true
          mountpoint -q /proc/sys/fs/binfmt_misc \
            || sudo mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc
          mountpoint /proc/sys/fs/binfmt_misc

      # --no-install-recommends is load-bearing, not tidiness. qemu-user
      # RECOMMENDS qemu-user-binfmt, which registers its own handler:
      #
      #   interpreter /usr/libexec/qemu-binfmt/aarch64-binfmt-P
      #   flags: PO
      #
      # No F flag, so it cannot work inside the build container -- and
      # because it is registered last it takes precedence over the one that
      # can. That entry, pulled in by a Recommends nobody asked for, is
      # what broke the previous two runs. It also explains the failing
      # grep in build-docker.sh, which looks for /usr/bin/qemu-aarch64 and
      # never sees that wrapper path.
      - name: Install the qemu interpreter on the host PATH
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          which qemu-aarch64
          dpkg -l | grep -q qemu-user-binfmt && {
            echo "qemu-user-binfmt got installed anyway; it will clobber the F entry" >&2
            exit 1
          } || true

      # Registered LAST, so nothing can overwrite it, and with exactly one
      # handler for the magic so there is no precedence question at all.
      - name: Register arm64 binfmt with the fix-binary flag
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          if [ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "removing pre-existing registration"
            echo -1 | sudo tee /proc/sys/fs/binfmt_misc/qemu-aarch64 >/dev/null
          fi
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          # The F flag is the whole point. Assert it rather than hope.
          grep -q '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64

      # Reproduce pi-gen's own check before spending half an hour on it.
      # build.sh runs `arch-test arm64` inside the build container, and
      # that is the only thing that actually proves the registration is
      # usable from another mount namespace.
      - name: Prove arm64 emulation works from inside a container
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          echo "== registrations visible on the host =="
          for f in /proc/sys/fs/binfmt_misc/qemu-aarch64*; do
            [ -e "$f" ] && { echo "--- $f"; cat "$f"; }
          done
          echo "== pi-gen's check, in a container =="
          docker run --privileged --rm debian:trixie-slim bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq arch-test
            mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
            arch-test arm64
          '

      - name: Install manual rendering tools
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y pandoc weasyprint

      - name: Build
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: ./image/build.sh

      # Saved HERE, immediately after the build -- not by actions/cache's
      # automatic post step, which runs under `post-if: success()`. With
      # the combined action, every run whose BOOT failed skipped the save,
      # so the cache stayed empty precisely while tier 3 was red -- which
      # is exactly when cheap iteration on the boot matters. Measured: two
      # consecutive runs each built the identical image for seven minutes
      # because the first one's save was silently skipped.
      - name: Save the image to the cache
        if: steps.imgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: image/deploy
          key: ${{ steps.imgcache.outputs.cache-primary-key }}

      # The ARTIFACT is uploaded BEFORE the image is booted, so that a
      # failing boot can be reported honestly without costing anyone the
      # image. See the boot step below for why that ordering matters. This
      # stays exactly where it is: debugging a red boot needs the image
      # that failed, and needs it whether or not the boot passed.
      #
      # The RELEASE attachment is a different question, and it has moved to
      # AFTER the boot. An artifact is for debugging a red run; a release
      # asset is a thing someone flashes to a card and hands to another
      # person. Those want opposite defaults, and for a while they shared
      # one -- so a tagged image that could not boot shipped anyway.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otp-print-unit-image
          path: image/deploy/*.img.xz
          if-no-files-found: error

      # Tier 3 of the harness: boot the artifact that was just built. Once
      # per image, not per commit -- it is emulated, so it is slow, and its
      # peripheral coverage is WORSE than tier 1's simulators. It answers
      # three questions nothing else can -- it used to be one, and the
      # overlay work added two: does the thing that gets flashed to a card
      # actually come up, does the unit start on the read-only overlay it
      # comes up on, and does a power-cycle discard what the session wrote
      # while keeping the settings? pi-gen assembles a filesystem and never
      # starts it. See harness/README.md.
      #
      # LAST, AND ALLOWED TO FAIL LOUDLY. This step used to run before the
      # upload with `continue-on-error: true`, so that an unvalidated check
      # could not cost anyone the image. The effect on its first real run
      # was worse than the problem it solved: tier 3 exited 1, and the job
      # went green with the GitHub API reporting this step's conclusion as
      # `success`. Anyone reading the status rather than the log would have
      # concluded the image booted. That is a check that cannot fail --
      # exactly what the rest of this harness exists to eliminate.
      #
      # Moving it after the upload gets both things: the artifact is already
      # safe, so a red boot costs nothing, and the boot can therefore be
      # honest about failing.
      #
      # 600 seconds PER BOOT, and it is a BACKSTOP, not a budget: the
      # harness stops each boot the moment its guest check reports done, so
      # only a boot that never gets there pays this number. It was 480 when
      # reaching the unit still raced the cap -- run 13's success line
      # landed ~420s in -- and the early stop is what made raising it free.
      # If a boot does hit 600, the verdict's "guest reached" line says
      # whether the guest was still moving, and the sampler's qemu-cpu
      # column says whether it was idle or spinning.
      - name: Boot the image
        env:
          OTP_IMG_TIMEOUT: 600
        run: |
          # apt-get update FIRST. The runner image ships an apt index that
          # is days stale, and qemu had moved 8.2.2-0ubuntu1.17 -> .18, so
          # the install 404'd and the boot step died in two seconds. On the
          # x86 path this was free -- the binfmt step ran `apt-get update`
          # on the way past -- and making that step skip on arm64 took the
          # update with it.
          sudo apt-get update
          # device-tree-compiler is for fdtput: QEMU is not the Pi firmware
          # and supplies no board revision, so harness/img-boot.sh writes
          # /system/linux,revision into a copy of the image's own DTB. Without
          # it rpi-eeprom-update.service dies on `(0x >> 23) & 1` in both
          # boots -- the emulator's fault, reported as the image's.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm mtools xz-utils device-tree-compiler
          OTP_IMG_WORK=${{ runner.temp }}/otp-img \
            ./harness/img-boot.sh image/deploy/*.img.xz
      - name: Boot verdict
        if: always()
        # Also to the step summary, which is on the run's landing page. The
        # verdict being in the log was not enough: the one line that
        # explained the first failure was thirty lines up and easy to scroll
        # past, and this repository keeps rediscovering that a diagnostic
        # nobody can find is not a diagnostic.
        run: |
          echo "=== tier 3 verdict ==="
          CACHED='${{ steps.imgcache.outputs.cache-hit }}'
          if [ "$CACHED" = "true" ]; then
            BUILT="restored from cache (no pi-gen build)"
          else
            BUILT="built from source (pi-gen ran)"
          fi
          {
            echo "## Tier 3 — booting the built image"
            echo
            echo "Image: **$BUILT**"
            echo
            echo '```'
            cat ${{ runner.temp }}/otp-img/verdict.txt 2>/dev/null \
              || echo "(the image never reported)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # THE RELEASE ASSET, and it is downstream of the boot on purpose.
      #
      # This used to sit above the boot step, next to the artifact upload,
      # and that was right when it was written: the boot gate was unproven,
      # and an unvalidated check must not cost anyone the image. It is not
      # right any more. Tier 3 boots the actual flashable artifact to a
      # running otp-unit.service in ~4.5 minutes cached, judges on
      # ANSI-stripped console evidence, and has its verdict logic under
      # sliced-test and mutation coverage. A tag whose image cannot boot
      # must produce a red run and NO asset, rather than a release someone
      # writes to a card and hands to another person.
      #
      # No `always()`, no `continue-on-error`, and that is the whole
      # mechanism: a step whose `if` names no status function carries an
      # implicit success(), so a red boot skips this and the tag ships
      # nothing. `success() &&` is written out anyway -- this is the line
      # that decides whether a broken image reaches a human, and it should
      # not depend on the reader remembering that rule.
      #
      # The `Boot verdict` step above runs under always() and therefore
      # cannot rescue this one: always() changes whether THAT step runs, not
      # the job's failure state.
      - name: Attach to the release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: image/deploy/*.img.xz
          # APPENDED. An earlier version set `body` plainly, reasoning that
          # append_body is consulted only on the action's UPDATE path and
          # that the first tag run -- a create -- was the only one that
          # mattered here. That weighed the wrong case. Publishing a release
          # through the GitHub UI creates the release AND the tag, and the
          # tag push is what starts this workflow, so by the time this step
          # runs the release already exists and the action takes the update
          # path (verified against src/github.ts):
          #
          #   if (input_append_body && workflowBody && existingReleaseBody)
          #     body = existingReleaseBody + "\n" + workflowBody;
          #   else
          #     body = workflowBody || existingReleaseBody;
          #
          # With append_body unset and a non-empty body, that else branch
          # REPLACES the maintainer's changelog with the paragraph below.
          # Silently destroying someone's release notes is worse than what
          # appending costs: this paragraph appearing twice if the same
          # tag's workflow is re-run, which is visible and editable.
          append_body: true
          #
          # A folded scalar, so the note reaches GitHub as one paragraph:
          # release bodies render hard line breaks, and a block scalar
          # would ship this at whatever width it happens to be wrapped to
          # in this file.
          #
          # THE CREDENTIAL SENTENCE SAYS "FOR THAT BOOT", and the clause is
          # load-bearing rather than cautious. "Applied and consumed by the
          # first boot" is exactly what the gate measures and a reader takes
          # it to mean their password now works -- but userconf applies with
          # `chpasswd -e` to /etc/shadow, /etc is inside the RAM overlay this
          # same paragraph describes two sentences earlier, and the seed is
          # deleted from the FAT partition, which is OUTSIDE it. So the
          # credential lasts exactly one boot and the file that would reapply
          # it is destroyed in the act of applying it; the account reverts to
          # pi-gen's random FIRST_USER_PASS, which nobody has. Nothing here
          # implies otherwise until the repository decides what to do about
          # it -- see device/install.sh, above the drop-in, for the open
          # question. A release note is the one place this project's claims
          # reach someone who cannot check them.
          body: >
            This image passed the tier-3 boot gate: it was booted under
            QEMU twice, `otp-unit.service` reached `Started` on both, the
            root filesystem was a RAM overlay over a read-only card, a file
            written to `/` in the first boot was gone in the second, and a
            setting written to `/boot/firmware` was still there. A
            `userconf.txt` seeded into the boot partition was applied and
            consumed by the first boot with no wizard -- **for that boot
            only**: the password is written to `/etc/shadow`, which is inside
            the RAM overlay, and the seed file is deleted from the card, so
            neither survives the power-cycle and this image does not give you
            a persistent login. The second boot skipped the wizard without
            disabling it, and a malformed seed failed fast and left
            `failed_userconf.txt` rather than holding the boot open. The
            first boot still had its front panel on tty1 afterwards, and
            neither boot was left waiting on a network this appliance does
            not have. That gate does not exercise the OLED, the buttons or a
            printer -- see the header of `harness/img-boot.sh` for exactly
            what it does and does not prove.

      # The bar, stated where it can be seen. Ten minutes is the budget for
      # a run that did not have to rebuild the image; a run that did is
      # expected to exceed it and says so rather than failing for it.
      # Reported rather than enforced: failing an otherwise-good job for
      # being slow teaches people to ignore the number.
      - name: Time budget
        if: always()
        run: |
          CACHED='${{ steps.imgcache.outputs.cache-hit }}'
          {
            echo
            echo "Budget: each of the two boots stops as soon as the"
              echo "guest check reports done; 600s per boot is the"
              echo "backstop only a boot that never reports pays."
            echo
            if [ "$CACHED" = "true" ]; then
              echo "This run restored the image from cache and went straight"
              echo "to the boot."
            else
              echo "This run rebuilt the image from source. On a native"
              echo "arm64 runner that is around seven minutes, so it fits"
              echo "the budget too -- the carve-out this text used to claim"
              echo "was written for x86 timings, where the same build took"
              echo "thirty-three."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The job log shows the last eighty console lines per boot; this
      # carries everything -- both UARTs of both boots in full, the verdict,
      # and the boot partition's own cmdline.txt and config.txt, so the
      # divergence between what the device would boot and what this harness
      # booted is part of the record. Two diagnoses this week were built on
      # a truncated tail; this is the end of that.
      #
      # The consoles moved into a directory per boot when tier 3 grew a
      # second one, so the glob has a level in it that the old path did not.
      - name: Upload the boot evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-boot-evidence
          path: |
            ${{ runner.temp }}/otp-img/*/console*.log
            ${{ runner.temp }}/otp-img/verdict.txt
            ${{ runner.temp }}/otp-img/boot/cmdline.txt
            ${{ runner.temp }}/otp-img/boot/config.txt
          retention-days: 7
          if-no-files-found: ignore

  # The required check. It runs on every pull request, whatever the diff
  # touched, so branch protection always has something to read.
  #
  # Fail-closed on purpose, in all three directions: a build that failed
  # fails this, a `changes` job that could not work out an answer fails
  # this, and a build that ran when it should not have fails this too.
  # The only green path is one where the reason for it is stated.
  image:
    needs: [changes, build]
    # Without always(), a skipped `build` skips this too -- and a skipped
    # required check never reports, which is the exact bug being fixed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          detected='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.image }}'
          built='${{ needs.build.result }}'
          echo "changes job:        $detected"
          echo "image paths touched: ${changed:-<unset>}"
          echo "build job:          $built"

          if [ "$detected" != "success" ]; then
            echo "could not determine whether the image needed building," >&2
            echo "so this cannot certify that it did not. Failing." >&2
            exit 1
          fi

          if [ "$changed" != "true" ]; then
            if [ "$built" != "skipped" ]; then
              echo "no image path changed, yet the build job is '$built'." >&2
              echo "One of the two is wrong; not certifying either." >&2
              exit 1
            fi
            echo "Nothing that goes into the image changed, so there is"
            echo "nothing to build and nothing to boot."
            exit 0
          fi

          if [ "$built" = "success" ]; then
            echo "The image built and the boot verdict passed."
            exit 0
          fi
          echo "the image job ended '$built'; see its log for the" >&2
          echo "IMG-CHECK lines and the boot evidence artifact." >&2
          exit 1

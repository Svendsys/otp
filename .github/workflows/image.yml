name: Build image

# Deliberately not on every push: the pi-gen build takes roughly half an
# hour and needs ~10GB of disk. Run it by hand, or on a tag to attach an
# image to a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # NOT tonistiigi/binfmt. pi-gen's build-docker.sh runs `which
      # qemu-aarch64` on the HOST and exits 1 if it is missing, so a
      # registration that only exists inside a container does not satisfy
      # it. It also greps binfmt_misc for that exact interpreter path, and
      # registers its own entry if it does not match -- so installing the
      # Debian packages covers both checks, and two mechanisms fighting
      # over the same handler covers neither.
      #
      # qemu-user-static is deliberately not enough on its own: it ships
      # qemu-aarch64-static, and pi-gen looks for the non-static name.
      - name: Install qemu for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user qemu-user-binfmt binfmt-support
          which qemu-aarch64
          ls /proc/sys/fs/binfmt_misc/qemu-aarch64* || true

      - name: Install manual rendering tools
        run: sudo apt-get install -y pandoc weasyprint

      - name: Build
        run: ./image/build.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otp-print-unit-image
          path: image/deploy/*.img.xz
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: image/deploy/*.img.xz

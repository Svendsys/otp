name: Build image

# Not on every push to a branch: the pi-gen build needs ~10GB of disk. It
# runs on tags (to attach an image to a release), by hand, and on pull
# requests, where the `changes` job limits the build to diffs that reach
# the image. otpunit/** is not in that filter: a change there breaks the
# unit, not the image build, and tiers 1 and 2 answer that in seconds.
#
# The budget is ten minutes of wall clock per PR. The image is cached on
# its inputs and the boot is capped.
#
# `push: master` populates that cache: caches created on a PR branch are
# visible only to that PR, caches on the base branch to every PR.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [master]
  pull_request:

# As in ci.yml: a superseded PR run is cancelled. Tag and dispatch runs
# are not; they produce artifacts people keep.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection requires a check called `image`. Path-filtering the
  # trigger would leave that check unreported on PRs that touch nothing in
  # the image, so the filter is a job, which suppresses only the work:
  #
  #   changes -> did anything that goes into the image change?
  #   build   -> the expensive arm64 pi-gen build and boot, if it did
  #   image   -> always runs, always reports, and is the required check
  #
  # The tier-3 boot verdict is a release gate (issue #19).
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs a base; the default shallow clone has none.
          fetch-depth: 0
      - name: Does anything in this change reach the image?
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A tag, a push to master (which populates the cache) or a
            # manual dispatch always builds.
            echo "${{ github.event_name }}: building unconditionally"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.base_ref }}"
          git fetch --no-tags --prune origin \
            "+refs/heads/$base:refs/remotes/origin/$base"
          # merge-base, not a two-dot diff: what this branch changed, not
          # everything that landed on master since it forked.
          changed=$(git diff --name-only \
            "$(git merge-base "origin/$base" HEAD)" HEAD)
          echo "$changed"
          # harness/img-guest-check.sh is listed because it is in the image:
          # the pi-gen stage copies harness/ into the rootfs and install.sh
          # installs the probe to /opt/otp-unit.
          if printf '%s\n' "$changed" | grep -qE \
              '^(image/|device/|harness/img-boot\.sh$|harness/img-guest-check\.sh$|\.github/workflows/image\.yml$)'
          then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing here goes into the image"
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # Native arm64, free for public repositories. On x86 every binary pi-gen
    # runs goes through qemu-user and needs the binfmt_misc steps below,
    # which are kept but skipped here so the workflow still runs on x86.
    needs: changes
    # The only conditional part. When this is skipped the `image` job below
    # still runs and reports.
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    # The job cap must always lose the race to the script's own timeouts: a
    # cancelled job skips the verdict and the evidence upload, because
    # failure() is false on cancellation.
    #
    # Worst case, three boots that never report:
    #
    #   3 x (600s backstop + timeout's 30s kill grace)   31.5 min
    #   pi-gen on a cache miss, slow runner              15.0 min
    #   checkout, apt, cache, upload, verdict             2.5 min
    #                                                    --------
    #                                                    49.0 min
    #
    # Healthy runs are far shorter: each probe boot stops when its guest
    # check reports done, and the release boot 45s after multi-user.target.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      # --- can we skip the expensive half entirely? -------------------
      #
      # Keyed on what ends up in the image, so a change to harness/img-boot.sh,
      # a test or a doc boots the previously built image and skips the build.
      #
      # harness/img-guest-check.sh is named separately because the probe runs
      # inside the image; without it in the key an edited check would boot
      # yesterday's probe. human_bias.png is in the key because otp.md embeds
      # it and render-manual.sh bakes it into the manual PDFs. otpunit/ and the
      # codewords are in the key though not in the PR filter: the filter asks
      # "is this worth checking", the key asks "is this image still current".
      - name: Restore a previously built image
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: image/deploy
          key: otp-image-${{ runner.arch }}-${{ hashFiles('image/**', 'device/**', 'otpunit/**', 'codewords/**', 'harness/img-guest-check.sh', 'otp_generator.py', 'otp.md', 'human_bias.png') }}

      - name: Free up disk space
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # x86 only. pi-gen needs both of:
      #
      # 1. A binfmt_misc registration with the F (fix binary) flag. build.sh
      #    runs `arch-test arm64` inside the build container, and without F the
      #    kernel resolves the interpreter in the caller's mount namespace.
      #    update-binfmts does not set F; registering from a container does.
      #
      # 2. The interpreter on the host PATH under its non-static name:
      #    build-docker.sh runs `which qemu-aarch64`.
      #
      # binfmt_misc must be mounted on the host: build-docker.sh otherwise
      # writes its own registration behind `2>/dev/null || true` and fails
      # silently.
      - name: Mount binfmt_misc on the host
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          sudo modprobe binfmt_misc || true
          mountpoint -q /proc/sys/fs/binfmt_misc \
            || sudo mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc
          mountpoint /proc/sys/fs/binfmt_misc

      # --no-install-recommends is load-bearing: qemu-user recommends
      # qemu-user-binfmt, which registers a handler without the F flag that
      # takes precedence over the one that works.
      - name: Install the qemu interpreter on the host PATH
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get install -y --no-install-recommends qemu-user
          which qemu-aarch64
          dpkg -l | grep -q qemu-user-binfmt && {
            echo "qemu-user-binfmt got installed anyway; it will clobber the F entry" >&2
            exit 1
          } || true

      # Registered last, so nothing can overwrite it, with exactly one handler
      # for the magic.
      - name: Register arm64 binfmt with the fix-binary flag
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          if [ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "removing pre-existing registration"
            echo -1 | sudo tee /proc/sys/fs/binfmt_misc/qemu-aarch64 >/dev/null
          fi
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          # Assert the F flag.
          grep -q '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64

      # Reproduce pi-gen's own check before spending the build on it:
      # `arch-test arm64` inside a container proves the registration is usable
      # from another mount namespace.
      - name: Prove arm64 emulation works from inside a container
        if: steps.imgcache.outputs.cache-hit != 'true' && runner.arch != 'ARM64'
        run: |
          echo "== registrations visible on the host =="
          for f in /proc/sys/fs/binfmt_misc/qemu-aarch64*; do
            [ -e "$f" ] && { echo "--- $f"; cat "$f"; }
          done
          echo "== pi-gen's check, in a container =="
          docker run --privileged --rm debian:trixie-slim bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq arch-test
            mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
            arch-test arm64
          '

      - name: Install manual rendering tools
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update && sudo apt-get install -y pandoc weasyprint

      - name: Build
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: ./image/build.sh

      # Saved here, not by actions/cache's post step, which runs only on
      # success: a run whose boot failed would skip the save, exactly when
      # cheap iteration on the boot matters.
      - name: Save the image to the cache
        if: steps.imgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: image/deploy
          key: ${{ steps.imgcache.outputs.cache-primary-key }}

      # The artifact is uploaded before the boot, because debugging a red boot
      # needs the image that failed. The release attachment is after the boot:
      # a release asset is something people flash.
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: otp-print-unit-image
          path: image/deploy/*.img.xz
          if-no-files-found: error

      # Tier 3 of the harness: boot the artifact that was just built. Once per
      # image, not per commit. See harness/README.md.
      #
      # After the upload and without continue-on-error, so a failed boot fails
      # the job while the artifact is already safe.
      #
      # 600 seconds per boot is a backstop: the harness stops each boot once it
      # has reported, so only a boot that never gets there pays it.
      - name: Boot the image
        env:
          OTP_IMG_TIMEOUT: 600
        run: |
          # Retries and a timeout, as in ci.yml: apt's default is 120s per
          # connection with no retry. And update first: the runner image's
          # apt index is stale enough for the install to 404.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          # device-tree-compiler is for fdtput, which harness/img-boot.sh uses
          # to give the guest the board revision the Pi firmware would supply.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm mtools xz-utils device-tree-compiler
          OTP_IMG_WORK=${{ runner.temp }}/otp-img \
            ./harness/img-boot.sh image/deploy/*.img.xz
      - name: Boot verdict
        if: always()
        # Also to the step summary, which is on the run's landing page.
        run: |
          echo "=== tier 3 verdict ==="
          CACHED='${{ steps.imgcache.outputs.cache-hit }}'
          if [ "$CACHED" = "true" ]; then
            BUILT="restored from cache (no pi-gen build)"
          else
            BUILT="built from source (pi-gen ran)"
          fi
          {
            echo "## Tier 3 — booting the built image"
            echo
            echo "Image: **$BUILT**"
            echo
            echo '```'
            cat ${{ runner.temp }}/otp-img/verdict.txt 2>/dev/null \
              || echo "(the image never reported)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The release asset is downstream of the boot on purpose: a tag whose
      # image cannot boot must produce a red run and no asset.
      #
      # A step whose `if` names no status function carries an implicit
      # success(); it is written out because this line decides whether a broken
      # image ships. The always() on `Boot verdict` above does not change the
      # job's failure state.
      - name: Attach to the release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: image/deploy/*.img.xz
          # Appended: publishing a release through the GitHub UI creates the
          # release before this workflow runs, and without append_body the
          # action replaces the maintainer's changelog with the body below.
          append_body: true
          # A folded scalar, so the note reaches GitHub as one paragraph:
          # release bodies render hard line breaks.
          #
          # tests/test_image_workflow.py holds this body against the names of
          # the checks that back it. The body must keep saying:
          #  - the password survives the power cycle, backed by the credential
          #    guest checks;
          #  - the username does not: userconf-pi's rename lives in the
          #    overlay (credential-recovers-a-store-naming-another-account);
          #  - the hash sits on a world-readable partition and can be attacked
          #    offline;
          #  - the image contains the test probe, what keeps it asleep, and the
          #    release boot that observed it (imgcheck-unit-considered-and-
          #    skipped, guest-probe-silent, guest-probe-journal-tag-absent,
          #    probe-droppings-stayed-off-the-card, identity-store-unchanged).
          body: >
            This image passed the tier-3 boot gate: it was booted under
            QEMU three times, `otp-unit.service` reached `Started` on all
            three, the
            root filesystem was a RAM overlay over a read-only card, a file
            written to `/` in the first boot was gone in the second, and a
            setting written to `/boot/firmware` was still there. A
            `userconf.txt` seeded into the boot partition was applied and
            consumed by the first boot with no wizard, and **the password was
            still in force after the power-cycle** -- the second boot's
            `/etc/shadow` carried the seeded hash, with no seed left on the
            card for it to have come from. That is a change: `/etc` is inside
            the RAM overlay and the wizard deletes the seed as the last step
            of applying it, so before this the credential lasted exactly one
            boot and the account reverted to the random build-time password,
            which nobody has. **The USERNAME does not survive, and only the
            password does.** If your `userconf.txt` names anything other than
            `otp`, `userconf-pi` renames the `otp` account to it -- and that
            rename lives entirely in `/etc` and `/home`, inside the overlay,
            so the next boot is back to `otp` with the password you chose.
            Log in as `otp`. The second boot of this gate proved that
            directly: a store naming an account this unit no longer had was
            applied to the account holding UID 1000 and the store was
            rewritten to match, so a seed naming another user costs you the
            name and never the login. The credential is kept in
            `/boot/firmware/otp-identity/credential`, written only on a boot
            where you seeded a `userconf.txt` yourself -- **so it is a
            password hash on the same world-readable FAT partition your own
            seed file was on, and it can be attacked offline by anyone who
            can read that card. Do not use a password you use elsewhere, and
            delete that file if you would rather not keep it.** The second
            boot skipped the wizard without
            disabling it, and a malformed seed failed fast and left
            `failed_userconf.txt` rather than holding the boot open. The
            first boot still had its front panel on tty1 afterwards, and
            neither boot was left waiting on a network this appliance does
            not have. The unit's IDENTITY survived the power-cycle as well:
            the second boot came up with the same machine-id the first boot
            recorded, and systemd did not treat it as a first boot --
            `first-boot-complete.target` is in the first boot's targets and
            not in the second's. That is a change -- `/etc` is inside the RAM
            overlay, so before this the machine-id reverted to
            `uninitialized` every time and systemd read every boot as a first
            boot, which is what kept re-enabling `ssh.socket` and
            regenerating the host keys. The machine-id is kept in
            `/boot/firmware/otp-identity`, on the FAT partition, which is
            mounted with `defaults` -- so it is world-readable to every
            account on the unit as well as to anyone who can mount the card.
            Nothing else is kept there: this image does **not** run `sshd`
            (`ENABLE_SSH=0`, so `ssh.service` is disabled), and no SSH host
            key is written outside the overlay. This image also **contains a
            test probe**, `/opt/otp-unit/img-guest-check.sh`, started by
            `otp-unit-imgcheck.service` -- and it is kept rather than
            stripped, because a gate run against a specially prepared build
            says nothing about the artifact you are holding. Its
            `ConditionKernelCommandLine=otp.imgcheck` is what keeps it
            asleep, and a **third boot of the same card with no such token**
            -- which is how your unit boots -- is what says so: systemd
            named the unit and skipped it, the probe printed nothing to the
            console and wrote nothing to its journal tag, and the two files
            it leaves on the boot partition were deleted before that boot
            and were still gone after it, with the identity store, the
            credential and the saved settings unchanged byte for byte. That
            gate does not exercise the OLED, the buttons or a printer -- see
            the header of `harness/img-boot.sh` for exactly what it does and
            does not prove.

      # Reported rather than enforced: failing an otherwise-good job for being
      # slow teaches people to ignore the number.
      - name: Time budget
        if: always()
        run: |
          CACHED='${{ steps.imgcache.outputs.cache-hit }}'
          {
            echo
            echo "Budget: each of the two probe boots stops as soon as the"
              echo "guest check reports done, and the release boot -- which"
              echo "has no probe -- stops 45s after multi-user.target; 600s"
              echo "per boot is the backstop only a boot that never gets"
              echo "there pays."
            echo
            if [ "$CACHED" = "true" ]; then
              echo "This run restored the image from cache and went straight"
              echo "to the boot."
            else
              echo "This run rebuilt the image from source. On a native"
              echo "arm64 runner that is around seven minutes, so it fits"
              echo "the budget too -- the carve-out this text used to claim"
              echo "was written for x86 timings, where the same build took"
              echo "thirty-three."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Everything a phase leaves behind: both UARTs of every boot in full, the
      # verdict, the card listings and digests (`*/boot-*.txt`), qemu-rc and
      # early-stop, and the boot partition's own cmdline.txt and config.txt.
      # tests/test_image_workflow.py reads the per-phase filenames out of
      # img-boot.sh and requires each to match a glob here.
      #
      # `if: failure()`: this is the diagnosis path. The digest files carry
      # sha256 of a password hash, never the hash.
      - name: Upload the boot evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-boot-evidence
          path: |
            ${{ runner.temp }}/otp-img/*/console*.log
            ${{ runner.temp }}/otp-img/*/boot-*.txt
            ${{ runner.temp }}/otp-img/*/qemu-rc
            ${{ runner.temp }}/otp-img/*/early-stop
            ${{ runner.temp }}/otp-img/verdict.txt
            ${{ runner.temp }}/otp-img/boot/cmdline.txt
            ${{ runner.temp }}/otp-img/boot/config.txt
          retention-days: 7
          if-no-files-found: ignore

  # The required check. It runs on every pull request, whatever the diff
  # touched, so branch protection always has something to read.
  #
  # Fail-closed: a failed build, a `changes` job with no answer, and a build
  # that ran when it should not have all fail this.
  image:
    needs: [changes, build]
    # Without always(), a skipped `build` skips this too, and a skipped
    # required check never reports.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          detected='${{ needs.changes.result }}'
          changed='${{ needs.changes.outputs.image }}'
          built='${{ needs.build.result }}'
          echo "changes job:        $detected"
          echo "image paths touched: ${changed:-<unset>}"
          echo "build job:          $built"

          if [ "$detected" != "success" ]; then
            echo "could not determine whether the image needed building," >&2
            echo "so this cannot certify that it did not. Failing." >&2
            exit 1
          fi

          if [ "$changed" != "true" ]; then
            if [ "$built" != "skipped" ]; then
              echo "no image path changed, yet the build job is '$built'." >&2
              echo "One of the two is wrong; not certifying either." >&2
              exit 1
            fi
            echo "Nothing that goes into the image changed, so there is"
            echo "nothing to build and nothing to boot."
            exit 0
          fi

          if [ "$built" = "success" ]; then
            echo "The image built and the boot verdict passed."
            exit 0
          fi
          echo "the image job ended '$built'; see its log for the" >&2
          echo "IMG-CHECK lines and the boot evidence artifact." >&2
          exit 1
